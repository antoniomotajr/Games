<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>RingSort & Garden — Pinos, Rosquinhas e Jardim</title>
  <style>
    :root {
      --bg-top: #4b78a3;
      --bg-bottom: #7fa2c4;
      --panel-bg: rgba(255, 255, 255, 0.94);
      --panel-border: rgba(255, 255, 255, 0.85);
      --text-dark: #162433;
      --text-muted: #4b6278;
      --accent-green: #22c55e;
      --accent-green-dark: #15803d;
      --accent-gold: #f59e0b;
      --accent-gold-dark: #b45309;
      --shadow-soft: 0 10px 25px rgba(15, 32, 52, 0.22);
      --shadow-card: 0 6px 16px rgba(15, 32, 52, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 680px;
      height: 100dvh;
      max-height: 980px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* HUD Superior */
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      z-index: 20;
      flex-shrink: 0;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--panel-bg);
      box-shadow: 0 4px 0 rgba(20, 40, 62, 0.24), var(--shadow-card);
      color: var(--text-dark);
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .icon-btn:active {
      transform: translateY(3px);
    }

    .icon-btn.muted {
      opacity: 0.65;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      box-shadow: 0 4px 0 rgba(20, 40, 62, 0.2), var(--shadow-card);
      font-weight: 800;
      font-size: 0.98rem;
      letter-spacing: 0.2px;
    }

    .coin-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fde047, #f59e0b 65%, #b45309 100%);
      border: 2px solid #fef08a;
      box-shadow: inset 0 0 0 1.5px rgba(120, 53, 15, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      color: #78350f;
    }

    .tabs-bar {
      display: flex;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(8px);
      padding: 4px;
      border-radius: 999px;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-card);
    }

    .tab-btn {
      position: relative;
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--text-dark);
      box-shadow: 0 3px 10px rgba(20, 42, 66, 0.18);
    }

    .notif-dot {
      position: absolute;
      top: 2px;
      right: 4px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #ef4444;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.35);
      animation: pulseDot 1.6s infinite;
      display: none;
    }

    .notif-dot.visible {
      display: block;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    /* Área principal das abas */
    .views-container {
      flex: 1;
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.24s ease, transform 0.24s ease;
    }

    .view.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* Aba Puzzle */
    .puzzle-header {
      text-align: center;
      padding: 2px 16px 6px;
      flex-shrink: 0;
    }

    .level-title {
      font-size: 1.55rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(18, 38, 60, 0.55), 0 4px 12px rgba(10, 25, 42, 0.3);
      letter-spacing: 0.4px;
    }

    .level-sub {
      font-size: 0.85rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.94);
      text-shadow: 0 1px 4px rgba(10, 25, 42, 0.35);
      margin-top: 2px;
    }

    .deadlock-banner {
      display: none;
      margin: 6px 16px 0;
      padding: 8px 14px;
      border-radius: 16px;
      background: rgba(254, 243, 199, 0.96);
      border: 2px solid #f59e0b;
      color: #78350f;
      font-size: 0.82rem;
      font-weight: 800;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: var(--shadow-card);
      flex-shrink: 0;
    }

    .deadlock-banner.visible {
      display: flex;
    }

    .deadlock-btn {
      border: none;
      border-radius: 10px;
      padding: 5px 10px;
      background: #b45309;
      color: #ffffff;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 220px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: manipulation;
    }

    /* Barra inferior de Power-ups */
    .controls-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 10px 16px 18px;
      flex-shrink: 0;
      z-index: 10;
    }

    .power-btn {
      flex: 1;
      max-width: 175px;
      border: none;
      border-radius: 18px;
      padding: 10px 12px;
      background: var(--panel-bg);
      box-shadow: 0 5px 0 rgba(20, 40, 62, 0.24), var(--shadow-card);
      color: var(--text-dark);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.12s ease, opacity 0.2s ease, background 0.2s ease;
    }

    .power-btn:hover:not(:disabled) {
      background: #ffffff;
    }

    .power-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(20, 40, 62, 0.24), var(--shadow-card);
    }

    .power-btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .power-top {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.92rem;
    }

    .power-cost {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent-gold-dark);
      background: rgba(245, 158, 11, 0.18);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* Aba Jardim */
    .garden-canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 210px;
      border-radius: 24px 24px 0 0;
      overflow: hidden;
      box-shadow: inset 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .garden-shop {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-top: 2px solid rgba(255, 255, 255, 0.9);
      padding: 12px 14px 18px;
      border-radius: 26px 26px 0 0;
      box-shadow: 0 -8px 28px rgba(15, 32, 52, 0.2);
      flex-shrink: 0;
    }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .shop-title {
      font-size: 1rem;
      font-weight: 900;
      color: var(--text-dark);
    }

    .shop-progress {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--accent-green-dark);
      background: rgba(34, 197, 94, 0.16);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 210px;
      overflow-y: auto;
      padding-bottom: 2px;
    }

    @media (max-width: 480px) {
      .shop-grid {
        grid-template-columns: repeat(2, 1fr);
        max-height: 185px;
      }
      .hud {
        padding: 10px 12px;
      }
      .tab-btn {
        padding: 7px 12px;
        font-size: 0.82rem;
      }
      .stat-pill {
        padding: 6px 11px;
        font-size: 0.88rem;
      }
    }

    .shop-card {
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      background: #ffffff;
      padding: 8px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 0 #e2e8f0;
    }

    .shop-card:hover:not(.owned):not(.locked) {
      transform: translateY(-2px);
      border-color: #60a5fa;
    }

    .shop-card:active:not(.owned):not(.locked) {
      transform: translateY(2px);
    }

    .shop-card.owned {
      background: #f0fdf4;
      border-color: #86efac;
      box-shadow: 0 3px 0 #bbf7d0;
      cursor: default;
    }

    .shop-card.locked {
      opacity: 0.62;
      cursor: not-allowed;
    }

    .shop-emoji {
      font-size: 1.45rem;
      line-height: 1.15;
    }

    .shop-name {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.2;
    }

    .shop-price {
      font-size: 0.73rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
    }

    .shop-card.owned .shop-price {
      background: #dcfce7;
      color: #166534;
    }

    /* Modal de Vitória */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 28, 46, 0.58);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 28px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(10, 22, 40, 0.35);
      transform: scale(0.86);
      transition: transform 0.26s cubic-bezier(0.22, 1.35, 0.36, 1);
    }

    .modal-backdrop.open .modal-card {
      transform: scale(1);
    }

    .win-badge {
      font-size: 2.8rem;
      margin-bottom: 6px;
    }

    .win-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-dark);
    }

    .win-reward {
      margin: 14px auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fef3c7;
      border: 2px solid #fcd34d;
      color: #92400e;
      font-weight: 900;
      font-size: 1.15rem;
      padding: 8px 18px;
      border-radius: 999px;
    }

    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 14px 18px;
      font-size: 1.05rem;
      font-weight: 900;
      color: #ffffff;
      background: linear-gradient(180deg, #34d399, var(--accent-green));
      box-shadow: 0 5px 0 var(--accent-green-dark);
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.12s ease;
    }

    .btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--accent-green-dark);
    }

    .btn-secondary {
      width: 100%;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 11px 16px;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-dark);
      background: #f8fafc;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s ease;
    }

    .btn-secondary:hover {
      background: #f1f5f9;
    }

    /* Toast de feedback */
    .toast {
      position: fixed;
      bottom: 92px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(15, 27, 42, 0.94);
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 60;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  
#app{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.power-btn{padding:8px 4px;font-size:.78rem}.power-top{font-size:.8rem;gap:3px;white-space:nowrap}
.controls-bar{gap:8px;padding:8px 10px 16px}
.level-sub{background:rgba(0,0,0,.2);display:inline-block;padding:3px 12px;border-radius:99px}
.win-badge{letter-spacing:4px}
</style>
</head>
<body>
  <div id="app">
    <!-- HUD Superior -->
    <header class="hud">
      <div class="hud-group">
        <button id="muteBtn" class="icon-btn" title="Alternar som" aria-label="Alternar som">🔊</button>
        <div class="stat-pill" title="Moedas disponíveis">
          <span class="coin-icon">$</span>
          <span id="coinsDisplay">0</span>
        </div>
      </div>

      <div class="tabs-bar" role="tablist">
        <button id="tabPuzzleBtn" class="tab-btn active" role="tab" aria-selected="true">
          🍩 Puzzle
        </button>
        <button id="tabGardenBtn" class="tab-btn" role="tab" aria-selected="false">
          🌸 Jardim
          <span id="gardenNotifDot" class="notif-dot" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <!-- Telas -->
    <main class="views-container">
      <!-- ABA 1: PUZZLE -->
      <section id="puzzleView" class="view active" aria-label="Quebra-cabeça de pinos e rosquinhas">
        <div class="puzzle-header">
          <h1 id="levelTitle" class="level-title">Nível 1</h1>
          <p id="levelSubtitle" class="level-sub">Agrupe 4 rosquinhas iguais em cada pino</p>
        </div>

        <div id="deadlockBanner" class="deadlock-banner" role="alert">
          <span>⚠️ Sem jogadas válidas nesta posição.</span>
          <button id="newSeedBtn" class="deadlock-btn" type="button">Nova Fase</button>
        </div>

        <div class="canvas-wrap">
          <canvas id="puzzleCanvas"></canvas>
        </div>

        <div class="controls-bar">
          <button id="undoBtn" class="power-btn" title="Desfazer última jogada">
            <span class="power-top">↩️ Desfazer</span>
            <span id="undoCostLabel" class="power-cost">Grátis</span>
          </button>

          <button id="extraPegBtn" class="power-btn" title="Adicionar pino vazio extra neste nível">
            <span class="power-top">📍 +1 Pino</span>
            <span id="extraPegCostLabel" class="power-cost">🪙 30</span>
          </button>

          <button id="hintBtn" class="power-btn" title="Mostrar uma jogada útil"><span class="power-top">💡 Dica</span><span class="power-cost">🪙 15</span></button>
          <button id="restartBtn" class="power-btn" title="Reiniciar nível atual">
            <span class="power-top">🔄 Reiniciar</span>
            <span class="power-cost">Nível</span>
          </button>
        </div>
      </section>

      <!-- ABA 2: JARDIM -->
      <section id="gardenView" class="view" aria-label="Jardim decorativo">
        <div class="garden-canvas-wrap">
          <canvas id="gardenCanvas"></canvas>
        </div>

        <div class="garden-shop">
          <div class="shop-header">
            <span class="shop-title">🌿 Decoração do Jardim</span>
            <span id="gardenProgressBadge" class="shop-progress">0 / 8 itens</span>
          </div>
          <div id="shopGrid" class="shop-grid"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal de Vitória -->
  <div id="winModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="winModalTitle">
    <div class="modal-card">
      <div class="win-badge">🎉🍩🌸</div>
      <h2 id="winModalTitle" class="win-title">Nível Concluído!</h2>
      <div class="win-reward">
        <span class="coin-icon">$</span>
        <span id="winCoinsText">+35 Moedas</span>
      </div>
      <button id="nextLevelBtn" class="btn-primary">Próximo Nível →</button>
      <button id="goGardenFromWinBtn" class="btn-secondary">Ir para o Jardim Decorar</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      // =========================================================================
      // 1. CONSTANTES E CATÁLOGO DO JOGO
      // =========================================================================
      const STORAGE_KEY = 'ringsort_garden_save_v1';
      const MAX_CAPACITY = 4;
      const UNDO_COST = 10;
      const EXTRA_PEG_COST = 30;

      const PALETTE = [
        { id: 'red',      name: 'Vermelho',  main: '#c81e1e', light: '#fca5a5', dark: '#6b1111', rim: '#450a0a' },
        { id: 'yellow',   name: 'Amarelo',   main: '#facc15', light: '#fef08a', dark: '#854d0e', rim: '#422006' },
        { id: 'blue',     name: 'Azul',      main: '#1d4ed8', light: '#93c5fd', dark: '#1e3a8a', rim: '#172554' },
        { id: 'green',    name: 'Verde',     main: '#15803d', light: '#86efac', dark: '#14532d', rim: '#052e16' },
        { id: 'purple',   name: 'Roxo',      main: '#9333ea', light: '#d8b4fe', dark: '#581c87', rim: '#3b0764' },
        { id: 'orange',   name: 'Laranja',   main: '#f97316', light: '#fdba74', dark: '#9a3412', rim: '#431407' },
        { id: 'cyan',     name: 'Ciano',     main: '#22d3ee', light: '#a5f3fc', dark: '#155e75', rim: '#083344' },
        { id: 'magenta',  name: 'Magenta',   main: '#ec4899', light: '#f9a8d4', dark: '#9d174d', rim: '#500724' },
        { id: 'lime',     name: 'Lima',      main: '#a3e635', light: '#d9f99d', dark: '#3f6212', rim: '#1a2e05' },
        { id: 'slate',    name: 'Chantilly', main: '#cbd5e1', light: '#ffffff', dark: '#94a3b8', rim: '#475569' }
      ];

      const GARDEN_ITEMS = [
        { id: 'lawn',       name: 'Gramado Verde',     emoji: '🌱', cost: 25  },
        { id: 'path',       name: 'Caminho Pedras',    emoji: '🪨', cost: 40  },
        { id: 'tulips',     name: 'Canteiro Tulipas',  emoji: '🌷', cost: 55  },
        { id: 'bench',      name: 'Banco Madeira',     emoji: '🪵', cost: 70  },
        { id: 'lanterns',   name: 'Lanternas',         emoji: '🏮', cost: 85  },
        { id: 'fountain',   name: 'Fonte d’Água',      emoji: '⛲', cost: 110 },
        { id: 'sakura',     name: 'Árv. Cerejeira',    emoji: '🌸', cost: 135 },
        { id: 'butterflies',name: 'Borboletas',        emoji: '🦋', cost: 160 }
      ];

      // =========================================================================
      // 2. SINTETIZADOR DE ÁUDIO (WEB AUDIO API)
      // =========================================================================
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        ensureContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        }

        setMuted(mute) {
          this.muted = mute;
        }

        playPickup() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.09);

          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.11);
        }

        playPlace() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          [540, 810].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = now + idx * 0.032;
            osc.type = idx === 0 ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(freq, start);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.75, start + 0.07);

            gain.gain.setValueAtTime(0.14, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.08);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.09);
          });
        }

        playError() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.linearRampToValueAtTime(135, now + 0.16);

          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.18);
        }

        playPegComplete() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = now + i * 0.06;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);

            gain.gain.setValueAtTime(0.13, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.24);
          });
        }

        playLevelWin() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const melody = [
            { f: 523.25, d: 0.12 },
            { f: 659.25, d: 0.12 },
            { f: 783.99, d: 0.12 },
            { f: 1046.5, d: 0.28 },
            { f: 783.99, d: 0.12 },
            { f: 1046.5, d: 0.42 }
          ];
          let offset = 0;
          melody.forEach((step) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = now + offset;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(step.f, start);

            gain.gain.setValueAtTime(0.16, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + step.d);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + step.d + 0.02);
            offset += step.d * 0.92;
          });
        }

        playGardenBuy() {
          if (this.muted) return;
          this.ensureContext();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const chord = [587.33, 739.99, 880, 1174.66];
          chord.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = now + i * 0.05;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, start);

            gain.gain.setValueAtTime(0.14, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.32);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.34);
          });
        }
      }

      // =========================================================================
      // 3. DIFICULDADE PROGRESSIVA INFINITA + VALIDADOR (BFS)
      // =========================================================================
      function getLevelSpec(n) {
        const L = Math.max(1, Math.floor(n));
        const colorCount = Math.min(PALETTE.length, 3 + Math.floor((L - 1) / 3));
        const emptyPegs = colorCount >= 8 && L < 45 ? 3 : 2;
        const scrambleSteps = Math.min(500, 16 + colorCount * 7 + Math.floor(L * 1.8));
        const fog = L >= 8 && (L % 5 === 0 || (L > 60 && L % 3 === 0));
        return { colorCount, emptyPegs, scrambleSteps, fog, cycle: Math.floor((L - 1) / 6), isEndless: L > 10 };
      }

      function isSolvedBoard(pegs) {
        return pegs.every(
          (p) => p.length === 0 || (p.length === MAX_CAPACITY && p.every((x) => x === p[0]))
        );
      }

      function serializeBoard(pegs) {
        return pegs.map((p) => p.join(',')).sort().join('|');
      }

      function canMoveOnBoard(pegs, fromIdx, toIdx) {
        if (fromIdx === toIdx) return false;
        const source = pegs[fromIdx];
        const target = pegs[toIdx];
        if (!source || source.length === 0) return false;
        if (!target || target.length >= MAX_CAPACITY) return false;
        if (target.length === 0) return true;
        return source[source.length - 1] === target[target.length - 1];
      }

      function hasAnyLegalMove(pegs) {
        for (let from = 0; from < pegs.length; from++) {
          if (pegs[from].length === 0) continue;
          if (pegs[from].length === MAX_CAPACITY && pegs[from].every((c) => c === pegs[from][0])) {
            continue;
          }
          for (let to = 0; to < pegs.length; to++) {
            if (canMoveOnBoard(pegs, from, to)) {
              return true;
            }
          }
        }
        return false;
      }

      function isBoardSolvable(startPegs, maxStates = 6500) {
        if (isSolvedBoard(startPegs)) return true;

        const queue = [startPegs.map((p) => [...p])];
        const visited = new Set([serializeBoard(startPegs)]);
        let head = 0;

        while (head < queue.length && head < maxStates) {
          const current = queue[head++];

          for (let from = 0; from < current.length; from++) {
            if (current[from].length === 0) continue;
            if (current[from].length === MAX_CAPACITY && current[from].every((x) => x === current[from][0])) {
              continue;
            }

            let movedToEmpty = false;
            for (let to = 0; to < current.length; to++) {
              if (!canMoveOnBoard(current, from, to)) continue;
              if (current[to].length === 0) {
                if (movedToEmpty) continue;
                movedToEmpty = true;
              }

              const next = current.map((p) => [...p]);
              next[to].push(next[from].pop());

              if (isSolvedBoard(next)) {
                return true;
              }

              const key = serializeBoard(next);
              if (!visited.has(key)) {
                visited.add(key);
                queue.push(next);
              }
            }
          }
        }

        return false;
      }

      function buildCandidateLevel(levelNumber) {
        const spec = getLevelSpec(levelNumber);
        const totalPegs = spec.colorCount + spec.emptyPegs;

        // Rotaciona levemente a janela de cores nos ciclos infinitos para variar o visual
        const colorIndices = [];
        const offset = spec.isEndless ? (spec.cycle * 2) % PALETTE.length : 0;
        for (let i = 0; i < spec.colorCount; i++) {
          colorIndices.push((i + offset) % PALETTE.length);
        }

        const pegs = [];
        for (let c = 0; c < colorIndices.length; c++) {
          const col = colorIndices[c];
          pegs.push([col, col, col, col]);
        }
        for (let e = 0; e < spec.emptyPegs; e++) {
          pegs.push([]);
        }

        let lastFrom = -1;
        let lastTo = -1;

        for (let step = 0; step < spec.scrambleSteps; step++) {
          const nonEmptyIndices = pegs
            .map((p, idx) => (p.length > 0 ? idx : -1))
            .filter((idx) => idx !== -1);

          if (nonEmptyIndices.length === 0) break;

          const fromIdx = nonEmptyIndices[Math.floor(Math.random() * nonEmptyIndices.length)];
          const candidateTargets = [];

          for (let toIdx = 0; toIdx < totalPegs; toIdx++) {
            if (toIdx === fromIdx) continue;
            if (pegs[toIdx].length >= MAX_CAPACITY) continue;
            if (fromIdx === lastTo && toIdx === lastFrom) continue;
            candidateTargets.push(toIdx);
          }

          if (candidateTargets.length > 0) {
            const toIdx = candidateTargets[Math.floor(Math.random() * candidateTargets.length)];
            pegs[toIdx].push(pegs[fromIdx].pop());
            lastFrom = fromIdx;
            lastTo = toIdx;
          }
        }

        if (isSolvedBoard(pegs) && totalPegs >= 2) {
          const a = pegs[0].pop();
          const b = pegs[1].pop();
          if (a !== undefined) pegs[1].push(a);
          if (b !== undefined) pegs[0].push(b);
        }

        return pegs;
      }

      function generateLevelState(n) {
        const s = getLevelSpec(n);
        const idx = [...PALETTE.keys()].slice(0, s.colorCount);
        const pegs = idx.map((c) => [c, c, c, c]);
        for (let e = 0; e < s.emptyPegs; e++) pegs.push([]);
        let last = null;
        for (let i = 0; i < s.scrambleSteps; i++) {
          const src = [];
          pegs.forEach((p, k) => { const l = p.length; if (l && (l === 1 || p[l - 1] === p[l - 2])) src.push(k); });
          if (!src.length) break;
          const a = src[(Math.random() * src.length) | 0];
          const dst = [];
          for (let b = 0; b < pegs.length; b++) {
            if (b !== a && pegs[b].length < MAX_CAPACITY && !(last && last[0] === b && last[1] === a)) dst.push(b);
          }
          if (!dst.length) continue;
          const b = dst[(Math.random() * dst.length) | 0];
          pegs[b].push(pegs[a].pop());
          last = [a, b];
        }
        if (isSolvedBoard(pegs)) { const a = pegs[0].pop(), b = pegs[1].pop(); if (b !== undefined) pegs[0].push(b); if (a !== undefined) pegs[1].push(a); }
        return pegs;
      }

      function getLevelReward(levelNumber) {
        return 25 + Math.min(levelNumber, 40) * 5;
      }

      // =========================================================================
      // 4. ESTADO GLOBAL E PERSISTÊNCIA (LOCALSTORAGE)
      // =========================================================================
      const state = {
        level: 1,
        coins: 50,
        ownedGarden: [],
        muted: false,
        activeTab: 'puzzle',

        pegs: [],
        initialPegs: [],
        history: [],
        freeUndosLeft: 2,
        extraPegUsed: false,
        selectedPeg: null,
        completedPegs: new Set(),
        levelWon: false,

        ringVisuals: [],
        particles: [],
        gardenPopAnim: {},
        butterflies: [],
        shakePeg: null,
        shakeTime: 0
      };

      let nextRingUid = 1;
      const sound = new SoundEngine();

      function saveProgress() {
        try {
          const payload = {
            level: state.level,
            coins: state.coins,
            ownedGarden: state.ownedGarden,
            muted: state.muted
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (_) {}
      }

      function loadProgress() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const data = JSON.parse(raw);
          if (typeof data.level === 'number' && data.level >= 1) state.level = Math.floor(data.level);
          if (typeof data.coins === 'number' && data.coins >= 0) state.coins = Math.floor(data.coins);
          if (Array.isArray(data.ownedGarden)) {
            state.ownedGarden = data.ownedGarden.filter((id) => GARDEN_ITEMS.some((item) => item.id === id));
          }
          if (typeof data.muted === 'boolean') {
            state.muted = data.muted;
            sound.setMuted(state.muted);
          }
        } catch (_) {}
      }

      // =========================================================================
      // 5. ELEMENTOS DO DOM E TOAST
      // =========================================================================
      const dom = {
        muteBtn: document.getElementById('muteBtn'),
        coinsDisplay: document.getElementById('coinsDisplay'),
        tabPuzzleBtn: document.getElementById('tabPuzzleBtn'),
        tabGardenBtn: document.getElementById('tabGardenBtn'),
        gardenNotifDot: document.getElementById('gardenNotifDot'),
        puzzleView: document.getElementById('puzzleView'),
        gardenView: document.getElementById('gardenView'),
        levelTitle: document.getElementById('levelTitle'),
        levelSubtitle: document.getElementById('levelSubtitle'),
        deadlockBanner: document.getElementById('deadlockBanner'),
        newSeedBtn: document.getElementById('newSeedBtn'),
        puzzleCanvas: document.getElementById('puzzleCanvas'),
        gardenCanvas: document.getElementById('gardenCanvas'),
        undoBtn: document.getElementById('undoBtn'),
        undoCostLabel: document.getElementById('undoCostLabel'),
        extraPegBtn: document.getElementById('extraPegBtn'),
        extraPegCostLabel: document.getElementById('extraPegCostLabel'),
        restartBtn: document.getElementById('restartBtn'),
        shopGrid: document.getElementById('shopGrid'),
        gardenProgressBadge: document.getElementById('gardenProgressBadge'),
        winModal: document.getElementById('winModal'),
        winCoinsText: document.getElementById('winCoinsText'),
        nextLevelBtn: document.getElementById('nextLevelBtn'),
        goGardenFromWinBtn: document.getElementById('goGardenFromWinBtn'),
        toast: document.getElementById('toast')
      };

      let toastTimer = null;
      function showToast(message) {
        dom.toast.textContent = message;
        dom.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          dom.toast.classList.remove('show');
        }, 2100);
      }

      // =========================================================================
      // 6. LÓGICA DO PUZZLE E ANIMAÇÕES DE ROSQUINHAS NO PINO
      // =========================================================================
      let pegGeometry = [];

      function clonePegs(pegs) {
        return pegs.map((p) => [...p]);
      }

      function getDistinctColorsCount(pegs) {
        const set = new Set();
        pegs.forEach((p) => p.forEach((c) => set.add(c)));
        return set.size;
      }

      function updateDeadlockStatus() {
        if (state.levelWon) {
          dom.deadlockBanner.classList.remove('visible');
          return;
        }
        const noMovesLeft = !hasAnyLegalMove(state.pegs);
        dom.deadlockBanner.classList.toggle('visible', noMovesLeft);
      }

      function computePegGeometry() {
        const rect = dom.puzzleCanvas.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        if (w <= 0 || h <= 0) return;

        const count = state.pegs.length;
        const perRow = count <= 5 ? count : Math.ceil(count / 2);
        const rows = Math.ceil(count / perRow);

        const maxPegW = 78;
        const minPegW = 40;
        const spacingX = Math.min(124, Math.max(44, (w - 32) / perRow));
        const pegWidth = Math.max(minPegW, Math.min(maxPegW, spacingX * 0.65));
        const pegHeight = rows === 1 ? Math.min(248, h * 0.66) : Math.min(180, (h * 0.82) / rows);
        const rodWidth = Math.max(11, pegWidth * 0.24);

        pegGeometry = [];
        for (let i = 0; i < count; i++) {
          const row = Math.floor(i / perRow);
          const itemsInRow = row === rows - 1 ? count - row * perRow : perRow;
          const col = i % perRow;
          const rowSpan = (itemsInRow - 1) * spacingX;
          const centerX = w / 2 - rowSpan / 2 + col * spacingX;

          const rowCenterY =
            rows === 1
              ? h * 0.57
              : (h * (row === 0 ? 0.30 : 0.75));

          pegGeometry.push({
            index: i,
            x: centerX,
            topY: rowCenterY - pegHeight * 0.45,
            baseY: rowCenterY + pegHeight * 0.45,
            width: pegWidth,
            height: pegHeight,
            rodWidth
          });
        }
      }

      function getRingTargetPos(pegIdx, slotIdx, isLifted) {
        const g = pegGeometry[pegIdx];
        if (!g) return { x: 0, y: 0 };
        const stackSpace = g.height * 0.68;
        const step = stackSpace / MAX_CAPACITY;
        const baseSlotY = g.baseY - g.height * 0.14 - slotIdx * step;
        const liftOffset = isLifted ? -Math.max(46, g.height * 0.27) : 0;
        return {
          x: g.x,
          y: baseSlotY + liftOffset
        };
      }

      function syncRingVisuals(snapImmediately = false) {
        computePegGeometry();
        const prevList = state.ringVisuals.map((v) => ({ ...v, _used: false }));
        const nextVisuals = [];

        state.pegs.forEach((peg, pIdx) => {
          peg.forEach((colorIdx, sIdx) => {
            let kk = peg.length - 1; while (kk > 0 && peg[kk - 1] === peg[peg.length - 1]) kk--;
            const isTop = sIdx >= kk;
            const isLifted = isTop && state.selectedPeg === pIdx;
            const target = getRingTargetPos(pIdx, sIdx, isLifted);

            let matched = prevList.find(
              (v) => !v._used && v.colorIdx === colorIdx && v.pegIdx === pIdx && v.slotIdx === sIdx
            );

            if (!matched) {
              matched = prevList.find(
                (v) => !v._used && v.colorIdx === colorIdx && v.pegIdx === pIdx
              );
            }

            if (!matched) {
              matched = prevList.find(
                (v) => !v._used && v.colorIdx === colorIdx
              );
            }

            if (matched && !snapImmediately) {
              matched._used = true;
              nextVisuals.push({
                uid: matched.uid,
                colorIdx,
                pegIdx: pIdx,
                slotIdx: sIdx,
                x: matched.x,
                y: matched.y,
                targetX: target.x,
                targetY: target.y,
                scale: matched.scale || 1,
                isLifted, isTop
              });
            } else {
              if (matched) matched._used = true;
              nextVisuals.push({
                uid: matched ? matched.uid : nextRingUid++,
                colorIdx,
                pegIdx: pIdx,
                slotIdx: sIdx,
                x: target.x,
                y: snapImmediately ? target.y : target.y - 28,
                targetX: target.x,
                targetY: target.y,
                scale: snapImmediately ? 1 : 0.9,
                isLifted, isTop
              });
            }
          });
        });

        state.ringVisuals = nextVisuals;
      }

      function checkPegCompletions() {
        state.pegs.forEach((peg, idx) => {
          const isFullSameColor =
            peg.length === MAX_CAPACITY && peg.every((c) => c === peg[0]);

          if (isFullSameColor && !state.completedPegs.has(idx)) {
            state.completedPegs.add(idx);
            sound.playPegComplete();
            const g = pegGeometry[idx];
            if (g) {
              spawnParticles(g.x, (g.topY + g.baseY) * 0.5, PALETTE[peg[0]].main, 24);
            }
          } else if (!isFullSameColor && state.completedPegs.has(idx)) {
            state.completedPegs.delete(idx);
          }
        });
      }

      function checkLevelVictory() {
        if (state.levelWon) return;
        if (isSolvedBoard(state.pegs)) {
          state.levelWon = true;
          dom.deadlockBanner.classList.remove('visible');
          const par = getLevelSpec(state.level).colorCount * 3 + 4, stars = state.moves <= par ? 3 : state.moves <= par * 1.6 ? 2 : 1;
          document.querySelector('.win-badge').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
          const reward = getLevelReward(state.level) + (stars - 1) * 10;
          state.coins += reward;
          state.level += 1;
          saveProgress();
          updateHUD();

          sound.playLevelWin();
          const rect = dom.puzzleCanvas.getBoundingClientRect();
          spawnParticles(rect.width * 0.5, rect.height * 0.4, '#facc15', 55);

          setTimeout(() => {
            dom.winCoinsText.textContent = `+${reward} Moedas`;
            dom.winModal.classList.add('open');
          }, 520);
        }
      }

      function handlePegClick(pegIdx) {
        if (state.levelWon || state.activeTab !== 'puzzle') return;
        if (pegIdx < 0 || pegIdx >= state.pegs.length) return;

        if (state.selectedPeg === null) {
          if (state.pegs[pegIdx].length === 0) {
            state.shakePeg = pegIdx;
            state.shakeTime = 0.25;
            sound.playError();
            return;
          }
          state.selectedPeg = pegIdx;
          sound.playPickup();
          syncRingVisuals(false);
          return;
        }

        if (state.selectedPeg === pegIdx) {
          state.selectedPeg = null;
          sound.playPlace();
          syncRingVisuals(false);
          return;
        }

        const fromIdx = state.selectedPeg;
        if (canMoveOnBoard(state.pegs, fromIdx, pegIdx)) {
          state.history.push({
            pegs: clonePegs(state.pegs),
            completedPegs: new Set(state.completedPegs)
          });

          const src = state.pegs[fromIdx], dst = state.pegs[pegIdx], top = src[src.length - 1];
          while (src.length && src[src.length - 1] === top && dst.length < MAX_CAPACITY) dst.push(src.pop());
          state.moves++; updateMoveInfo();
          state.selectedPeg = null;

          sound.playPlace();
          syncRingVisuals(false);
          checkPegCompletions();
          updatePowerUpButtons();
          checkLevelVictory();
          updateDeadlockStatus();
        } else {
          state.shakePeg = pegIdx;
          state.shakeTime = 0.25;
          sound.playError();
          showToast('Só pode encaixar em pino vazio ou de mesma cor');
        }
      }

      function startLevel(levelNum) {
        state.level = Math.max(1, Math.floor(levelNum));
        const spec = getLevelSpec(state.level);
        const generated = generateLevelState(state.level);
        state.pegs = clonePegs(generated);
        state.initialPegs = clonePegs(generated);
        state.history = [];
        state.freeUndosLeft = 2;
        state.extraPegUsed = false;
        state.selectedPeg = null;
        state.completedPegs = new Set();
        state.levelWon = false; state.moves = 0; state.hint = null; state.fog = spec.fog; state.world = getWorld(state.level);

        dom.levelTitle.textContent = `Nível ${state.level}`;
        const colorsUsed = getDistinctColorsCount(generated);
        const cycleLabel = spec.isEndless ? ` • Ciclo ${spec.cycle}` : '';
        const W = state.world, prevW = startLevel._w; startLevel._w = W;
        const rs = document.documentElement.style; rs.setProperty('--bg-top', W.sky[0]); rs.setProperty('--bg-bottom', W.sky[1]);
        state.subBase = `${W.emoji} ${W.name} • ${colorsUsed} cores` + (spec.fog ? ' • 🌫️ Névoa' : '');
        updateMoveInfo();
        if (prevW && prevW !== W) showToast(`Novo mundo: ${W.name} ${W.emoji}`);

        syncRingVisuals(true);
        checkPegCompletions();
        updatePowerUpButtons();
        updateDeadlockStatus();
        updateHUD();
      }

      function restartCurrentLevel() {
        if (state.levelWon) return;
        state.pegs = clonePegs(state.initialPegs);
        state.history = [];
        state.selectedPeg = null;
        state.completedPegs = new Set();
        sound.playPlace();
        syncRingVisuals(false);
        checkPegCompletions();
        updatePowerUpButtons();
        updateDeadlockStatus();
        state.moves = 0; updateMoveInfo(); showToast('Nível reiniciado');
      }

      function handleUndo() {
        if (state.levelWon || state.history.length === 0) return;

        if (state.freeUndosLeft > 0) {
          state.freeUndosLeft -= 1;
        } else {
          if (state.coins < UNDO_COST) {
            sound.playError();
            showToast(`Moedas insuficientes (precisa de ${UNDO_COST})`);
            return;
          }
          state.coins -= UNDO_COST;
          saveProgress();
          updateHUD();
        }

        const prev = state.history.pop();
        state.pegs = clonePegs(prev.pegs);
        state.completedPegs = new Set(prev.completedPegs);
        state.moves = Math.max(0, state.moves - 1); updateMoveInfo();
        state.selectedPeg = null;
        sound.playPickup();
        syncRingVisuals(false);
        updatePowerUpButtons();
        updateDeadlockStatus();
      }

      function handleAddExtraPeg() {
        if (state.levelWon) return;
        if (state.extraPegUsed) {
          showToast('Pino extra já adicionado neste nível');
          return;
        }
        if (state.coins < EXTRA_PEG_COST) {
          sound.playError();
          showToast(`Precisa de ${EXTRA_PEG_COST} moedas para +1 Pino`);
          return;
        }

        state.coins -= EXTRA_PEG_COST;
        state.extraPegUsed = true;
        state.pegs.push([]);
        state.selectedPeg = null;
        saveProgress();
        updateHUD();
        sound.playPlace();
        syncRingVisuals(false);
        updatePowerUpButtons();
        updateDeadlockStatus();
        showToast('Pino extra adicionado!');
      }

      function updatePowerUpButtons() {
        dom.undoBtn.disabled = state.history.length === 0 || state.levelWon;
        dom.undoCostLabel.textContent =
          state.freeUndosLeft > 0 ? `Grátis (${state.freeUndosLeft})` : `🪙 ${UNDO_COST}`;

        dom.extraPegBtn.disabled = state.extraPegUsed || state.levelWon;
        dom.extraPegCostLabel.textContent = state.extraPegUsed ? 'Usado' : `🪙 ${EXTRA_PEG_COST}`;
      }

      // =========================================================================
      // 7. PARTÍCULAS E RENDERIZAÇÃO DO PUZZLE
      // =========================================================================
      function spawnParticles(cx, cy, color, count = 20) {
        const confettiColors = [color, '#fde047', '#38bdf8', '#f472b6', '#4ade80'];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 70 + Math.random() * 210;
          state.particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 90,
            size: 5 + Math.random() * 6,
            color: confettiColors[i % confettiColors.length],
            alpha: 1,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 10,
            life: 0.65 + Math.random() * 0.45
          });
        }
      }

      function drawPegPost(ctx, g, isSelected, shakeOffsetX) {
        const cx = g.x + shakeOffsetX;
        const rodW = g.rodWidth;
        const rodLeft = cx - rodW / 2;
        const rodTop = g.topY + 8;
        const rodBottom = g.baseY - 4;

        if (isSelected) {
          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.beginPath();
          ctx.roundRect(cx - g.width * 0.62, g.topY - 8, g.width * 1.24, g.height + 18, 24);
          ctx.fill();
          ctx.restore();
        }

        ctx.save();
        ctx.fillStyle = 'rgba(15, 28, 45, 0.28)';
        ctx.beginPath();
        ctx.ellipse(cx, g.baseY + 8, g.width * 0.56, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const rodGrad = ctx.createLinearGradient(rodLeft, 0, rodLeft + rodW, 0);
        rodGrad.addColorStop(0, '#475569');
        rodGrad.addColorStop(0.35, '#f8fafc');
        rodGrad.addColorStop(0.75, '#94a3b8');
        rodGrad.addColorStop(1, '#334155');

        ctx.fillStyle = rodGrad;
        ctx.beginPath();
        ctx.roundRect(rodLeft, rodTop, rodW, rodBottom - rodTop, [rodW / 2, rodW / 2, 2, 2]);
        ctx.fill();

        ctx.fillStyle = '#f1f5f9';
        ctx.beginPath();
        ctx.ellipse(cx, rodTop + 2, rodW * 0.46, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        const baseGrad = ctx.createLinearGradient(cx - g.width * 0.5, g.baseY - 8, cx + g.width * 0.5, g.baseY + 8);
        baseGrad.addColorStop(0, '#e2e8f0');
        baseGrad.addColorStop(0.55, '#94a3b8');
        baseGrad.addColorStop(1, '#334155');

        ctx.fillStyle = baseGrad;
        ctx.beginPath();
        ctx.roundRect(cx - g.width * 0.5, g.baseY - 7, g.width, 14, 7);
        ctx.fill();
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }

      function drawDonutRingBack(ctx, ring, g) {
        const pal = ringPal(ring);
        const outerRx = g.width * 0.52 * ring.scale;
        const outerRy = 12 * ring.scale;
        const innerRx = Math.max(g.rodWidth * 0.68, g.width * 0.19) * ring.scale;
        const innerRy = 4.6 * ring.scale;
        const bodyH = 10.5 * ring.scale;
        const topY = ring.y - bodyH * 0.25;

        ctx.save();
        ctx.translate(ring.x, 0);

        ctx.fillStyle = pal.main;
        ctx.strokeStyle = pal.rim;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, topY, outerRx, outerRy, 0, Math.PI, Math.PI * 2);
        ctx.ellipse(0, topY, innerRx, innerRy, 0, 0, Math.PI, true);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }

      function drawDonutRingFront(ctx, ring, g) {
        const pal = ringPal(ring);
        const outerRx = g.width * 0.52 * ring.scale;
        const outerRy = 12 * ring.scale;
        const innerRx = Math.max(g.rodWidth * 0.68, g.width * 0.19) * ring.scale;
        const innerRy = 4.6 * ring.scale;
        const bodyH = 10.5 * ring.scale;
        const topY = ring.y - bodyH * 0.25;
        const botY = ring.y + bodyH * 0.55;

        ctx.save();
        ctx.translate(ring.x, 0);

        const sideGrad = ctx.createLinearGradient(-outerRx, 0, outerRx, 0);
        sideGrad.addColorStop(0, pal.dark);
        sideGrad.addColorStop(0.35, pal.main);
        sideGrad.addColorStop(0.75, pal.dark);
        sideGrad.addColorStop(1, pal.rim);

        ctx.fillStyle = sideGrad;
        ctx.strokeStyle = pal.rim;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(0, botY, outerRx, outerRy, 0, 0, Math.PI);
        ctx.lineTo(-outerRx, topY);
        ctx.ellipse(0, topY, outerRx, outerRy, 0, Math.PI, 0, true);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        const topGrad = ctx.createLinearGradient(-outerRx, topY - outerRy, outerRx, topY + outerRy);
        topGrad.addColorStop(0, pal.light);
        topGrad.addColorStop(0.42, pal.main);
        topGrad.addColorStop(1, pal.dark);

        ctx.fillStyle = topGrad;
        ctx.beginPath();
        ctx.ellipse(0, topY, outerRx, outerRy, 0, 0, Math.PI);
        ctx.ellipse(0, topY, innerRx, innerRy, 0, Math.PI, 0, true);
        ctx.closePath();
        ctx.fill();

        if (pal !== FOG_PAL) {
          const mx = (outerRx + innerRx) / 2, my = (outerRy + innerRy) / 2, sc = [pal.light, '#ffffff'];
          for (let i = 0; i < 6; i++) {
            const th = Math.PI * (0.18 + i * 0.12 + ((ring.uid * 13 + i * 7) % 10) / 200);
            ctx.save();
            ctx.translate(Math.cos(th) * mx, topY + Math.sin(th) * my);
            ctx.rotate(th * 3 + ring.uid);
            ctx.fillStyle = sc[(i + ring.uid) % 2];
            ctx.fillRect(-2.4, -0.9, 4.8, 1.8);
            ctx.restore();
          }
        }
        if (pal !== FOG_PAL) {
          ctx.font = 'bold ' + (10 * ring.scale) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          const sy = topY + outerRy + (botY - topY) / 2 + 0.5;
          ctx.lineWidth = 2.4; ctx.strokeStyle = pal.rim; ctx.strokeText(pal.sym, 0, sy);
          ctx.fillStyle = '#ffffff'; ctx.fillText(pal.sym, 0, sy);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.ellipse(0, topY, outerRx - 1.2, outerRy - 1.2, 0, 0.12, Math.PI - 0.12);
        ctx.stroke();

        ctx.strokeStyle = pal.rim;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(0, topY, innerRx, innerRy, 0, 0, Math.PI);
        ctx.stroke();

        ctx.restore();
      }

      function renderPuzzleCanvas(dt) {
        const rect = dom.puzzleCanvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const targetW = Math.floor(rect.width * dpr);
        const targetH = Math.floor(rect.height * dpr);

        if (dom.puzzleCanvas.width !== targetW || dom.puzzleCanvas.height !== targetH) {
          dom.puzzleCanvas.width = targetW;
          dom.puzzleCanvas.height = targetH;
          syncRingVisuals(true);
        }

        const ctx = dom.puzzleCanvas.getContext('2d');
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, rect.width, rect.height);
        drawScene(ctx, rect.width, rect.height, dt);

        if (state.shakeTime > 0) {
          state.shakeTime = Math.max(0, state.shakeTime - dt);
        }

        const lerpSpeed = 1 - Math.exp(-20 * dt);
        for (const ring of state.ringVisuals) {
          ring.x += (ring.targetX - ring.x) * lerpSpeed;
          ring.y += (ring.targetY - ring.y) * lerpSpeed;
          ring.scale += (1 - ring.scale) * lerpSpeed;
        }

        const orderedRings = [...state.ringVisuals].sort((a, b) => a.slotIdx - b.slotIdx);
        const fallbackGeom = { width: 64, rodWidth: 15 };

        orderedRings.forEach((ring) => {
          const g = pegGeometry[ring.pegIdx] || fallbackGeom;
          drawDonutRingBack(ctx, ring, g);
        });

        pegGeometry.forEach((g, idx) => {
          const shakeX =
            state.shakePeg === idx && state.shakeTime > 0
              ? Math.sin(performance.now() * 0.065) * 7
              : 0;
          drawPegPost(ctx, g, state.selectedPeg === idx, shakeX);
          const now = performance.now();
          if (state.completedPegs.has(idx)) {
            ctx.save(); ctx.font = '18px serif'; ctx.textAlign = 'center';
            ctx.fillText('⭐', g.x, g.topY - 6 + Math.sin(now / 300 + idx) * 3); ctx.restore();
          }
          if (state.hint && now < state.hint.until && (state.hint.from === idx || state.hint.to === idx)) {
            ctx.save(); ctx.strokeStyle = state.hint.from === idx ? '#fde047' : '#4ade80'; ctx.lineWidth = 4;
            ctx.globalAlpha = 0.6 + 0.4 * Math.sin(now / 120); ctx.beginPath();
            ctx.roundRect(g.x - g.width * 0.62, g.topY - 8, g.width * 1.24, g.height + 18, 24); ctx.stroke(); ctx.restore();
          }
        });

        orderedRings.forEach((ring) => {
          const g = pegGeometry[ring.pegIdx] || fallbackGeom;
          drawDonutRingFront(ctx, ring, g);
        });

        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            state.particles.splice(i, 1);
            continue;
          }
          p.vy += 420 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.vRot * dt;
          p.alpha = Math.max(0, Math.min(1, p.life * 1.4));

          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        }

        ctx.restore();
      }

      // =========================================================================
      // 8. JARDIM FLORIDO (META-JOGO + LOJA + LOCALSTORAGE)
      // =========================================================================
      function hasOwned(id) {
        return state.ownedGarden.includes(id);
      }

      function getPopScale(itemId) {
        const start = state.gardenPopAnim[itemId];
        if (!start) return 1;
        const elapsed = (performance.now() - start) / 420;
        if (elapsed >= 1) {
          delete state.gardenPopAnim[itemId];
          return 1;
        }
        const overshoot = Math.sin(elapsed * Math.PI) * 0.24 * (1 - elapsed);
        return Math.min(1.25, 0.35 + elapsed * 0.65 + overshoot);
      }

      function ensureButterflies(w, h) {
        if (!hasOwned('butterflies')) {
          state.butterflies = [];
          return;
        }
        if (state.butterflies.length === 0) {
          const colors = ['#f472b6', '#facc15', '#38bdf8', '#c084fc'];
          for (let i = 0; i < 6; i++) {
            state.butterflies.push({
              x: w * (0.18 + Math.random() * 0.64),
              y: h * (0.35 + Math.random() * 0.35),
              vx: (Math.random() - 0.5) * 45,
              vy: (Math.random() - 0.5) * 28,
              phase: Math.random() * Math.PI * 2,
              color: colors[i % colors.length]
            });
          }
        }
      }

      function renderGardenCanvas(dt) {
        const rect = dom.gardenCanvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const targetW = Math.floor(rect.width * dpr);
        const targetH = Math.floor(rect.height * dpr);

        if (dom.gardenCanvas.width !== targetW || dom.gardenCanvas.height !== targetH) {
          dom.gardenCanvas.width = targetW;
          dom.gardenCanvas.height = targetH;
        }

        const w = rect.width;
        const h = rect.height;
        if (w <= 0 || h <= 0) return;

        const ctx = dom.gardenCanvas.getContext('2d');
        ctx.save();
        ctx.scale(dpr, dpr);

        const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.52);
        skyGrad.addColorStop(0, '#7dd3fc');
        skyGrad.addColorStop(1, '#e0f2fe');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, h * 0.52);

        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(w * 0.84, h * 0.16, Math.min(w, h) * 0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        [[0.15, 0.12, 1], [0.55, 0.2, 0.8], [0.35, 0.07, 0.6]].forEach(([cx, cy, s], i) => {
          const x = ((cx * w + performance.now() * 0.01 * (i + 1)) % (w + 120)) - 60, y = h * cy;
          [[0, 0, 22], [22, 4, 17], [-22, 5, 16]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.fill(); });
        });
        ctx.beginPath();
        ctx.fill();

        ctx.fillStyle = hasOwned('lawn') ? '#86efac' : '#cbd5e1';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.46);
        ctx.quadraticCurveTo(w * 0.28, h * 0.33, w * 0.58, h * 0.45);
        ctx.quadraticCurveTo(w * 0.82, h * 0.52, w, h * 0.41);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        const groundGrad = ctx.createLinearGradient(0, h * 0.44, 0, h);
        if (hasOwned('lawn')) {
          groundGrad.addColorStop(0, '#4ade80');
          groundGrad.addColorStop(1, '#15803d');
        } else {
          groundGrad.addColorStop(0, '#d6b88c');
          groundGrad.addColorStop(1, '#9c7850');
        }
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, h * 0.44, w, h * 0.56);

        if (!hasOwned('lawn')) {
          ctx.fillStyle = 'rgba(110, 82, 52, 0.35)';
          for (let i = 0; i < 14; i++) {
            const px = ((i * 97) % 100) / 100 * w;
            const py = h * (0.5 + ((i * 53) % 45) / 100);
            ctx.beginPath();
            ctx.ellipse(px, py, 6, 3.5, 0.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (hasOwned('path')) {
          ctx.save();
          const s = getPopScale('path');
          ctx.translate(w * 0.5, h * 0.74);
          ctx.scale(s, s);
          ctx.translate(-w * 0.5, -h * 0.74);

          const stones = [
            { x: 0.50, y: 0.54, rx: 14, ry: 7 },
            { x: 0.47, y: 0.62, rx: 17, ry: 8 },
            { x: 0.52, y: 0.70, rx: 19, ry: 9 },
            { x: 0.46, y: 0.79, rx: 22, ry: 10 },
            { x: 0.51, y: 0.89, rx: 25, ry: 11 }
          ];
          stones.forEach((st) => {
            ctx.fillStyle = '#e2e8f0';
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(w * st.x, h * st.y, st.rx, st.ry, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });
          ctx.restore();
        }

        if (hasOwned('tulips')) {
          ctx.save();
          const s = getPopScale('tulips');
          ctx.translate(w * 0.24, h * 0.74);
          ctx.scale(s, s);

          ctx.fillStyle = '#78350f';
          ctx.beginPath();
          ctx.ellipse(0, 8, 56, 16, 0, 0, Math.PI * 2);
          ctx.fill();

          const tulipColors = ['#f43f5e', '#fbbf24', '#ec4899', '#a855f7', '#fb7185'];
          for (let i = -2; i <= 2; i++) {
            const tx = i * 19;
            const ty = -4 + Math.abs(i) * 2;
            ctx.strokeStyle = '#16a34a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(tx, ty + 10);
            ctx.lineTo(tx, ty - 8);
            ctx.stroke();

            ctx.fillStyle = tulipColors[i + 2];
            ctx.beginPath();
            ctx.arc(tx, ty - 11, 7, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        if (hasOwned('bench')) {
          ctx.save();
          const s = getPopScale('bench');
          ctx.translate(w * 0.76, h * 0.68);
          ctx.scale(s, s);

          ctx.fillStyle = '#334155';
          ctx.fillRect(-26, -2, 6, 18);
          ctx.fillRect(20, -2, 6, 18);

          ctx.fillStyle = '#b45309';
          ctx.strokeStyle = '#78350f';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(-34, -22, 68, 9, 4);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.roundRect(-36, -6, 72, 10, 4);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        if (hasOwned('lanterns')) {
          ctx.save();
          const s = getPopScale('lanterns');
          [0.12, 0.88].forEach((posX) => {
            ctx.save();
            ctx.translate(w * posX, h * 0.56);
            ctx.scale(s, s);

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-3, -34, 6, 36);
            ctx.beginPath();
            ctx.moveTo(-12, -34);
            ctx.lineTo(0, -45);
            ctx.lineTo(12, -34);
            ctx.closePath();
            ctx.fill();

            const glow = ctx.createRadialGradient(0, -26, 2, 0, -26, 20);
            glow.addColorStop(0, '#fef08a');
            glow.addColorStop(0.5, 'rgba(250, 204, 21, 0.55)');
            glow.addColorStop(1, 'rgba(250, 204, 21, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, -26, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fde047';
            ctx.fillRect(-6, -33, 12, 12);
            ctx.restore();
          });
          ctx.restore();
        }

        if (hasOwned('fountain')) {
          ctx.save();
          const s = getPopScale('fountain');
          ctx.translate(w * 0.5, h * 0.53);
          ctx.scale(s, s);

          ctx.fillStyle = '#cbd5e1';
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(0, 6, 44, 14, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.ellipse(0, 4, 36, 10, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#e2e8f0';
          ctx.fillRect(-8, -22, 16, 26);

          const splashOffset = Math.sin(performance.now() * 0.008) * 3;
          ctx.strokeStyle = '#bae6fd';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(0, -24);
          ctx.quadraticCurveTo(-14, -38 + splashOffset, -22, 2);
          ctx.moveTo(0, -24);
          ctx.quadraticCurveTo(14, -38 - splashOffset, 22, 2);
          ctx.stroke();

          ctx.restore();
        }

        if (hasOwned('sakura')) {
          ctx.save();
          const s = getPopScale('sakura');
          ctx.translate(w * 0.16, h * 0.47);
          ctx.scale(s, s);

          ctx.fillStyle = '#78350f';
          ctx.beginPath();
          ctx.moveTo(-9, 4);
          ctx.lineTo(-5, -44);
          ctx.lineTo(5, -44);
          ctx.lineTo(9, 4);
          ctx.closePath();
          ctx.fill();

          const pinkClusters = [
            { x: 0, y: -56, r: 30, c: '#f472b6' },
            { x: -22, y: -44, r: 22, c: '#f9a8d4' },
            { x: 22, y: -44, r: 22, c: '#ec4899' },
            { x: 0, y: -72, r: 22, c: '#fbcfe8' }
          ];
          pinkClusters.forEach((cl) => {
            ctx.fillStyle = cl.c;
            ctx.beginPath();
            ctx.arc(cl.x, cl.y, cl.r, 0, Math.PI * 2);
            ctx.fill();
          });

          ctx.restore();
        }

        ensureButterflies(w, h);
        if (hasOwned('butterflies') && state.butterflies.length > 0) {
          const s = getPopScale('butterflies');
          state.butterflies.forEach((b) => {
            b.phase += dt * 11;
            b.x += b.vx * dt + Math.cos(b.phase * 0.25) * 14 * dt;
            b.y += b.vy * dt + Math.sin(b.phase * 0.35) * 12 * dt;

            if (b.x < w * 0.08 || b.x > w * 0.92) b.vx *= -1;
            if (b.y < h * 0.22 || b.y > h * 0.72) b.vy *= -1;

            const wingSpan = Math.max(2, Math.abs(Math.sin(b.phase)) * 9) * s;

            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.fillStyle = b.color;

            ctx.beginPath();
            ctx.ellipse(-wingSpan * 0.65, 0, wingSpan, 5 * s, -0.25, 0, Math.PI * 2);
            ctx.ellipse(wingSpan * 0.65, 0, wingSpan, 5 * s, 0.25, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-1.5, -5 * s, 3, 10 * s);
            ctx.restore();
          });
        }

        ctx.restore();
      }

      // =========================================================================
      // 9. LOJA DO JARDIM E HUD
      // =========================================================================
      function renderGardenShop() {
        dom.shopGrid.innerHTML = '';
        const ownedCount = state.ownedGarden.length;
        dom.gardenProgressBadge.textContent = `${ownedCount} / ${GARDEN_ITEMS.length} itens`;

        GARDEN_ITEMS.forEach((item) => {
          const isOwned = hasOwned(item.id);
          const canAfford = !isOwned && state.coins >= item.cost;

          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'shop-card';
          if (isOwned) card.classList.add('owned');
          else if (!canAfford) card.classList.add('locked');

          card.innerHTML = `
            <span class="shop-emoji">${item.emoji}</span>
            <span class="shop-name">${item.name}</span>
            <span class="shop-price">${isOwned ? '✓ Instalado' : `🪙 ${item.cost}`}</span>
          `;

          card.addEventListener('click', () => {
            if (isOwned) {
              showToast(`${item.name} já está no jardim`);
              return;
            }
            if (state.coins < item.cost) {
              sound.playError();
              showToast(`Faltam ${item.cost - state.coins} moedas para ${item.name}`);
              return;
            }

            state.coins -= item.cost;
            state.ownedGarden.push(item.id);
            state.gardenPopAnim[item.id] = performance.now();
            saveProgress();
            sound.playGardenBuy();
            updateHUD();
            renderGardenShop();
            showToast(`${item.name} adicionado ao jardim!`);
          });

          dom.shopGrid.appendChild(card);
        });
      }

      function updateHUD() {
        dom.coinsDisplay.textContent = state.coins;
        dom.muteBtn.textContent = state.muted ? '🔇' : '🔊';
        dom.muteBtn.classList.toggle('muted', state.muted);

        const hasAffordableItem = GARDEN_ITEMS.some(
          (item) => !hasOwned(item.id) && state.coins >= item.cost
        );
        dom.gardenNotifDot.classList.toggle('visible', hasAffordableItem);
      }

      function switchTab(tabName) {
        state.activeTab = tabName;
        const isPuzzle = tabName === 'puzzle';

        dom.tabPuzzleBtn.classList.toggle('active', isPuzzle);
        dom.tabPuzzleBtn.setAttribute('aria-selected', String(isPuzzle));
        dom.tabGardenBtn.classList.toggle('active', !isPuzzle);
        dom.tabGardenBtn.setAttribute('aria-selected', String(!isPuzzle));

        dom.puzzleView.classList.toggle('active', isPuzzle);
        dom.gardenView.classList.toggle('active', !isPuzzle);

        if (isPuzzle) {
          requestAnimationFrame(() => syncRingVisuals(true));
        } else {
          renderGardenShop();
        }
      }

      // =========================================================================
      // 10. EVENTOS DE ENTRADA (MOUSE, TOQUE, BOTÕES) E LOOP PRINCIPAL
      // =========================================================================
      function hitTestPeg(clientX, clientY) {
        computePegGeometry();
        const rect = dom.puzzleCanvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        for (const g of pegGeometry) {
          const padX = Math.max(26, g.width * 0.65);
          const padTop = 70;
          const padBottom = 22;
          if (
            x >= g.x - padX &&
            x <= g.x + padX &&
            y >= g.topY - padTop &&
            y <= g.baseY + padBottom
          ) {
            return g.index;
          }
        }
        return -1;
      }

      let lastPointerHandledAt = 0;

      dom.puzzleCanvas.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
        lastPointerHandledAt = performance.now();
        sound.ensureContext();
        const idx = hitTestPeg(e.clientX, e.clientY);
        if (idx !== -1) {
          handlePegClick(idx);
        }
      });

      dom.puzzleCanvas.addEventListener('click', (e) => {
        if (performance.now() - lastPointerHandledAt < 120) return;
        sound.ensureContext();
        const idx = hitTestPeg(e.clientX, e.clientY);
        if (idx !== -1) {
          handlePegClick(idx);
        }
      });

      dom.newSeedBtn.addEventListener('click', () => {
        startLevel(state.level);
        showToast(`Nova distribuição gerada para o Nível ${state.level}`);
      });

      dom.muteBtn.addEventListener('click', () => {
        state.muted = !state.muted;
        sound.setMuted(state.muted);
        if (!state.muted) sound.ensureContext();
        saveProgress();
        updateHUD();
        showToast(state.muted ? 'Som desativado' : 'Som ativado');
      });

      dom.tabPuzzleBtn.addEventListener('click', () => switchTab('puzzle'));
      dom.tabGardenBtn.addEventListener('click', () => switchTab('garden'));

      dom.undoBtn.addEventListener('click', handleUndo);
      dom.extraPegBtn.addEventListener('click', handleAddExtraPeg);
      dom.restartBtn.addEventListener('click', restartCurrentLevel);

      dom.nextLevelBtn.addEventListener('click', () => {
        dom.winModal.classList.remove('open');
        startLevel(state.level);
      });

      dom.goGardenFromWinBtn.addEventListener('click', () => {
        dom.winModal.classList.remove('open');
        startLevel(state.level);
        switchTab('garden');
      });

      window.addEventListener('resize', () => {
        if (state.activeTab === 'puzzle') {
          syncRingVisuals(true);
        }
      });

      let lastFrameTime = performance.now();
      function gameLoop(now) {
        const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
        lastFrameTime = now;

        if (state.activeTab === 'puzzle') {
          renderPuzzleCanvas(dt);
        } else {
          renderGardenCanvas(dt);
        }

        requestAnimationFrame(gameLoop);
      }

      PALETTE.forEach((p, i) => { p.sym = '●▲■★♥◆✚☾✖☀'[i]; });
      const FOG_PAL = { main: '#7c8aa0', light: '#cbd5e1', dark: '#475569', rim: '#1e293b' };
      function ringPal(r) { return state.fog && !r.isTop ? FOG_PAL : (PALETTE[r.colorIdx] || PALETTE[0]); }
      const WORLDS = [
        { name: 'Confeitaria', emoji: '🧁', sky: ['#e0709f', '#fcb97d'], hill: ['rgba(255,214,230,.45)', 'rgba(255,160,190,.55)'], orb: '#fff3b0', fx: { c: '#ffffff', dir: 1, r: 3, n: 34 } },
        { name: 'Jardim', emoji: '🌸', sky: ['#4b78a3', '#9ad1b0'], hill: ['rgba(120,200,140,.45)', 'rgba(60,150,100,.55)'], orb: '#fef08a', fx: { c: '#fbcfe8', dir: 1, r: 3.5, n: 26, petal: 1 } },
        { name: 'Inverno', emoji: '❄️', sky: ['#5a7ea8', '#cfe2f3'], hill: ['rgba(255,255,255,.5)', 'rgba(200,225,245,.7)'], orb: '#f1f5f9', fx: { c: '#ffffff', dir: 1, r: 2.6, n: 60 } },
        { name: 'Noite Mágica', emoji: '🌙', sky: ['#1b2559', '#5b3f93'], hill: ['rgba(40,30,100,.55)', 'rgba(25,20,70,.7)'], orb: '#fef9c3', fx: { c: '#fde68a', dir: -1, r: 2.6, n: 36, glow: 1 } },
        { name: 'Pôr do Sol', emoji: '🌅', sky: ['#e8590c', '#fbbf24'], hill: ['rgba(190,60,30,.45)', 'rgba(120,40,30,.55)'], orb: '#fff7ed', fx: { c: '#fff7ed', dir: -1, r: 2, n: 28, glow: 1 } },
        { name: 'Oceano', emoji: '🫧', sky: ['#0c6b8f', '#5ccbe8'], hill: ['rgba(20,110,150,.5)', 'rgba(10,80,120,.65)'], orb: '#e0f7ff', fx: { c: '#e0f7ff', dir: -1, r: 4, n: 30, bubble: 1 } }
      ];
      function getWorld(L) { return WORLDS[Math.floor((L - 1) / 6) % WORLDS.length]; }
      function updateMoveInfo() { dom.levelSubtitle.textContent = (state.subBase || '') + ' • Jogadas: ' + state.moves; }

      function drawScene(ctx, w, h, dt) {
        const W = state.world || WORLDS[0], t = performance.now() / 1000, f = W.fx;
        if (!state.fx || state.fxW !== W) {
          state.fxW = W;
          state.fx = Array.from({ length: f.n }, () => ({ x: Math.random() * w, y: Math.random() * h, s: 0.5 + Math.random(), p: Math.random() * 6 }));
        }
        ctx.save();
        ctx.fillStyle = W.orb; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(w * 0.82, h * 0.12, Math.min(w, h) * 0.07, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
        [[0.7, 0, 0.6, 16], [0.8, 1, 1, 22]].forEach(([y, k, sp, amp]) => {
          ctx.fillStyle = W.hill[k]; ctx.beginPath(); ctx.moveTo(0, h);
          for (let x = 0; x <= w + 12; x += 12) ctx.lineTo(x, h * y + Math.sin(x * 0.011 + k * 2 + t * 0.2 * sp) * amp);
          ctx.lineTo(w, h); ctx.fill();
        });
        state.fx.forEach((q) => {
          q.y += f.dir * (14 + 22 * q.s) * dt; q.x += Math.sin(t * 0.8 + q.p) * 10 * dt;
          if (q.y > h + 8) q.y = -8; if (q.y < -8) q.y = h + 8;
          ctx.globalAlpha = f.glow ? 0.4 + 0.5 * Math.sin(t * 2 + q.p) : 0.75;
          ctx.fillStyle = f.c; ctx.strokeStyle = f.c; ctx.beginPath();
          if (f.bubble) { ctx.lineWidth = 1.3; ctx.arc(q.x, q.y, f.r * q.s, 0, 7); ctx.stroke(); }
          else if (f.petal) { ctx.ellipse(q.x, q.y, f.r * q.s * 1.4, f.r * q.s * 0.7, t + q.p, 0, 7); ctx.fill(); }
          else { ctx.arc(q.x, q.y, f.r * q.s, 0, 7); ctx.fill(); }
        });
        ctx.restore();
      }

      function findHint() {
        const P = state.pegs; let best = null, bs = -99;
        P.forEach((s, f) => {
          if (!s.length) return;
          const uni = s.every((x) => x === s[0]);
          if (uni && s.length === MAX_CAPACITY) return;
          P.forEach((d, to) => {
            if (!canMoveOnBoard(P, f, to)) return;
            let sc = d.length ? 20 + d.length : (uni ? -9 : 2);
            if (!uni) sc += 3;
            if (sc > bs) { bs = sc; best = [f, to]; }
          });
        });
        return best;
      }
      function handleHint() {
        if (state.levelWon) return;
        const m = findHint();
        if (!m) { showToast('Sem jogadas disponíveis'); return; }
        if (state.coins < 15) { sound.playError(); showToast('Precisa de 15 moedas para a dica'); return; }
        state.coins -= 15; saveProgress(); updateHUD();
        state.hint = { from: m[0], to: m[1], until: performance.now() + 2600 };
        sound.playPickup();
      }
      document.getElementById('hintBtn').addEventListener('click', handleHint);

      // Inicialização
      loadProgress();
      updateHUD();
      startLevel(state.level);
      renderGardenShop();
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
