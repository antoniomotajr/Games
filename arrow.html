html{scroll-padding-top:env(safe-area-inset-top,0px)}

#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.side{width:min(210px,30vw);font-size:11px;font-weight:700}
.row{display:flex;justify-content:space-between;margin-bottom:4px}
.bar{height:10px;background:rgba(128,118,100,.3);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;transition:width .3s}
#mid{text-align:center}#mid small{display:block;font-size:10px;letter-spacing:.12em;opacity:.7;text-transform:uppercase}
#dist{font-family:Cinzel;font-weight:900;font-size:clamp(15px,3vw,24px)}
#sub{position:absolute;top:calc(env(safe-area-inset-top,0px) + 78px);left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;font:600 11px Inter;pointer-events:none}
#sub .pnl{padding:3px 9px;pointer-events:auto}
#sub-right{display:flex;gap:6px;align-items:center;pointer-events:none}
#bar{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 5px);left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px;width:min(99.5vw,1320px);padding:3px 5px;overflow:visible}
.w,.wp{padding:2px 2px;border-radius:7px;cursor:pointer;text-align:center;font:600 clamp(6.5px,.62vw,7.8px)/1.1 Inter;border:2px solid transparent;min-width:0;flex:1 1 42px;max-width:60px}
.w b,.wp b{display:block;font-size:clamp(11px,1.2vw,14px);font-weight:400;margin-bottom:1px}.w.on,.wp.on{border-color:var(--gold);transform:translateY(-2px);background:rgba(184,139,58,.14)}.w.no,.wp.no{opacity:.35;cursor:default}
.sep{width:1px;height:22px;background:rgba(128,118,100,.4);margin:0 1px;flex-shrink:0}
#ov{position:absolute;inset:0;background:rgba(20,18,16,.62);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#box{background:#F3ECE0;color:#1E1C1A;border:1px solid rgba(30,28,26,.3);border-radius:14px;padding:24px;max-width:450px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
#ok{font:700 11px Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
#ot{font-size:28px;font-weight:900;margin:4px 0 10px}
#ob{font:400 12.5px/1.45 Inter;text-align:left;background:#EFE5D3;padding:12px 14px;border-radius:9px;margin-bottom:16px;max-height:52vh;overflow-y:auto}
.obtn{width:100%;padding:12px;background:#1E1C1A;color:#F3ECE0;border:0;border-radius:9px;font:700 14px Cinzel;letter-spacing:.14em;cursor:pointer;margin-top:8px}
.obtn:first-of-type{margin-top:0}
.obtn:hover{background:var(--green)}
.obtn.sec{background:#5c5346}
.obtn.out{background:var(--red)}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
 <div class="pnl side"><div class="row"><span>JOGADOR</span><span id="ph">100</span></div><div class="bar"><i id="pb" style="background:var(--green);width:100%"></i></div></div>
 <div class="pnl" id="mid"><small id="stg">FASE 1</small><div id="dist">18 METROS</div><small id="tn" style="color:var(--green);font-weight:700">Sua vez</small></div>
 <div class="pnl side"><div class="row"><span id="ah">100</span><span>RIVAL</span></div><div class="bar"><i id="ab" style="background:var(--red);width:100%;float:right"></i></div></div>
</div>
<div id="sub">
 <div class="pnl">PONTOS <b id="sc">0</b> · RECORDE <b id="hs" style="color:var(--gold)">0</b> · <span id="cb"></span></div>
 <div class="pnl" id="wd">💨</div>
 <div id="sub-right">
  <div class="pnl" id="bgmBtn" style="cursor:pointer" title="Mutar/Ativar música de fundo">🎵</div>
  <div class="pnl" id="pbtn" style="cursor:pointer" title="Pausar (ESC)">⏸</div>
  <div class="pnl" id="snd" style="cursor:pointer" title="Mutar/Ativar efeitos sonoros">🔊</div>
 </div>
</div>
<div id="bar" class="pnl"></div>
<div id="ov"><div id="box"><div id="ok"></div><div id="ot"></div><div id="ob"></div><div id="oactions"></div></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),cx=cv.getContext('2d');
let W=0,H=0,cam={s:1,ox:0,oy:0};
const G=392,PPM=22,VMAX=1450;

const AR={
 STD:{n:'Ferro',i:'🏹',v:1,g:1,d:1,w:1,c:'#cbd5e0',m:Infinity},
 HEAVY:{n:'Perfura',i:'⛏️',v:.85,g:1.4,d:1.5,w:.35,c:'#4a5568',m:5},
 SWIFT:{n:'Vento',i:'⚡',v:1.35,g:.7,d:.85,w:.6,c:'#319795',m:5},
 FIRE:{n:'Fogo',i:'🔥',v:1.05,g:.9,d:1.15,w:1,c:'#ed8936',m:4},
 TRIPLE:{n:'Tripla',i:'🔱',v:1,g:1,d:.6,w:1,c:'#b88b3a',m:3},
 POISON:{n:'Veneno',i:'☠️',v:1,g:1,d:.5,w:1,c:'#7bc043',m:3},
 CHICKEN:{n:'Frango',i:'🐔',v:.92,g:1.15,d:.75,w:1.3,c:'#f6ad55',m:3},
 HEART:{n:'Coração',i:'💘',v:1.06,g:.88,d:0,w:.9,c:'#e53e3e',m:3},
 SAW:{n:'Serra',i:'🪚',v:.9,g:1.1,d:1.65,w:.5,c:'#a0aec0',m:3},
 MAGNET:{n:'Ímã',i:'🧲',v:1.08,g:.92,d:.95,w:.4,c:'#63b3ed',m:3},
 HARPOON:{n:'Arpão',i:'🎣',v:1.16,g:1.05,d:1.45,w:.45,c:'#4fd1c5',m:3},
 MACHINE:{n:'Metralha',i:'🔫',v:1.25,g:.78,d:.42,w:.75,c:'#f56565',m:2},
 PLUNGER:{n:'Desentup',i:'🪠',v:1,g:1,d:0,w:.8,c:'#3182ce',m:3},
 BALLOON:{n:'Balão',i:'🎈',v:1,g:.85,d:.35,w:.9,c:'#f687b3',m:3},
 TRAMPOLINE:{n:'Mola',i:'🤸',v:1,g:1,d:.3,w:.9,c:'#48bb78',m:3},
 HEN:{n:'Galinha',i:'🐓',v:.96,g:1.05,d:.45,w:1.1,c:'#ecc94b',m:3},
 DISCO:{n:'Disco',i:'🪩',v:1,g:.95,d:.3,w:.9,c:'#d53f8c',m:3},
 SLAP:{n:'Tapa',i:'🖐️',v:1.1,g:.95,d:.85,w:.7,c:'#ed8936',m:3},
 ANVIL:{n:'Bigorna',i:'🪨',v:1.05,g:.95,d:2.1,w:.6,c:'#2d3748',m:2},
 COWARD:{n:'Covarde',i:'🫣',v:1.15,g:.85,d:.9,w:.8,c:'#9f7aea',m:3},
 SWAP:{n:'Troca',i:'🔄',v:1.05,g:.9,d:.2,w:.8,c:'#38b2ac',m:2}};
const KEYS=Object.keys(AR);

const WC={
 BOW:{n:'Arco',i:'🏹',v:1,g:1,d:1,w:1},
 AXE:{n:'Machado',i:'🪓',v:.72,g:1.45,d:1.9,w:.3},
 SPEAR:{n:'Lança',i:'🗡️',v:1.12,g:.85,d:1.3,w:.55}};
let wc='BOW',wa={BOW:Infinity,AXE:4,SPEAR:5},aw={AXE:3,SPEAR:4,POISON:2,CHICKEN:2,HEART:2,SAW:2,MAGNET:2,HARPOON:2,MACHINE:2};

const BIO=[
 {n:'Campo ao Amanhecer',sky:['#f4c99a','#fcefd9'],sun:'#f08a3c',sx:.78,sy:.3,gr:'#8a9a5b',dirt:'#6b5a3c',m:['#c9a98b','#b08f7a'],tr:'#5d7a45',tk:'#5a3f26',pine:0},
 {n:'Floresta no Entardecer',sky:['#d9764a','#f6d6a8'],sun:'#c4372b',sx:.25,sy:.5,gr:'#6f7d45',dirt:'#5a4630',m:['#8d6a6a','#6e5256'],tr:'#3f5a36',tk:'#40301f',pine:1},
 {n:'Fortaleza na Noite',sky:['#10152e','#3b4676'],sun:'#e8e6d0',sx:.7,sy:.2,gr:'#2f4038',dirt:'#1f2a25',m:['#3a4266','#2a3052'],tr:'#1f3a30',tk:'#241a12',pine:1,night:1},
 {n:'Montanhas Nevadas',sky:['#b9c8d4','#eef2f3'],sun:'#fff7e0',sx:.2,sy:.25,gr:'#e6edf0',dirt:'#9aa7ad',m:['#9db0bd','#7f93a3'],tr:'#3d5a52',tk:'#3a2c20',pine:1,snow:1}];
const PRE=[[0,0,'',''],[0,55,'','hill'],[34,0,'cart',''],[0,105,'','tower'],[50,80,'wood','wood'],[70,22,'hill','cart']];

let state='START',prevState='PLAY',st=1,dist=18,bi=BIO[0],score=0,hs=0,wind=0,combo=0,sel='STD',ammo={};
let plats=[],trees=[],clouds=[],stars=[],snow=[],arrows=[],parts=[],txts=[],burstQueue=[],trampolines=[];
let over=false,slow=0,shake=0,volley=false,T=0,acc=0,last=performance.now(),turnOf='P';

try{hs=+localStorage.getItem('archer_hs')||0}catch(e){}
$('hs').textContent=hs;

function makeChar(){return{x:0,y:0,vx:0,vy:0,air:false,hp:100,burn:0,dead:0,flash:0,rec:0,par:0,psn:0,love:0,plunger:0,balloon:0,hen:0,disco:0,bounce:0}}
const P=makeChar(),A=makeChar();
let aim={a:0,p:0},ai={a:0,p:0,t:'STD',k:'BOW',tm:0,n:1},drag=false;

/* ---------- ÁUDIO ---------- */
const bgm=new Audio('arrow.mp3');
bgm.loop=true;
bgm.preload='auto';
bgm.volume=.35;

const snd={on:true,bgmOn:true,c:null,
 init(){
  if(!this.c){const C=window.AudioContext||window.webkitAudioContext;if(C)this.c=new C()}
  if(this.c&&this.c.state==='suspended')this.c.resume().catch(()=>{});
  this.syncBgm();
 },
 syncBgm(){
  if(!this.bgmOn){bgm.pause();return;}
  bgm.volume=(state==='PAUSED')?.1:.35;
  bgm.play().catch(()=>{});
 },
 tone(f,d,t='triangle',v=.3,e=40){if(!this.on||!this.c)return;const c=this.c,n=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,e),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d)},
 noise(d,v,cut){if(!this.on||!this.c)return;const c=this.c,n=c.currentTime,b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);f.connect(c.destination);s.start(n)},
 cocorico(){
  if(!this.on||!this.c)return;
  const c=this.c,n=c.currentTime;
  const notes=[[520,660,0,.09],[660,820,.09,.1],[760,580,.19,.11],[740,420,.3,.24]];
  for(const[f0,f1,at,dur]of notes){
   const o=c.createOscillator(),g=c.createGain();
   o.type='sawtooth';
   o.frequency.setValueAtTime(f0,n+at);
   o.frequency.exponentialRampToValueAtTime(f1,n+at+dur);
   g.gain.setValueAtTime(.001,n+at);
   g.gain.linearRampToValueAtTime(.16,n+at+.03);
   g.gain.exponentialRampToValueAtTime(.001,n+at+dur);
   o.connect(g);g.connect(c.destination);o.start(n+at);o.stop(n+at+dur+.02);
  }
 },
 heartSound(){if(!this.on||!this.c)return;this.tone(587,.12,'sine',.2,784);setTimeout(()=>this.tone(784,.18,'sine',.2,988),110)},
 sawSound(){if(!this.on||!this.c)return;this.tone(135,.28,'sawtooth',.22,195);this.noise(.25,.18,2200)},
 magnetSound(){if(!this.on||!this.c)return;this.tone(320,.22,'sine',.18,640)},
 harpoonSound(){if(!this.on||!this.c)return;this.tone(190,.16,'triangle',.25,75);this.noise(.12,.2,1200)},
 plungerSound(){if(!this.on||!this.c)return;this.tone(170,.16,'sine',.25,520)},
 balloonSound(){if(!this.on||!this.c)return;this.tone(220,.32,'sine',.2,680)},
 springSound(){if(!this.on||!this.c)return;this.tone(160,.24,'triangle',.24,740)},
 discoSound(){if(!this.on||!this.c)return;[440,554,659,880].forEach((f,i)=>setTimeout(()=>this.tone(f,.13,'square',.11,f*1.05),i*75))},
 slapSound(){if(!this.on||!this.c)return;this.noise(.14,.65,2800);this.tone(240,.14,'triangle',.25,65)},
 anvilSound(){if(!this.on||!this.c)return;this.tone(95,.35,'sawtooth',.28,35);this.noise(.22,.45,900)},
 cowardSound(){if(!this.on||!this.c)return;this.tone(680,.18,'sine',.2,420);setTimeout(()=>this.tone(740,.15,'sine',.18,360),120)},
 swapSound(){if(!this.on||!this.c)return;this.tone(420,.14,'sine',.2,860);setTimeout(()=>this.tone(860,.16,'sine',.2,420),110)},
 shot(t){
  if(t==='CHICKEN'||t==='HEN'){this.cocorico();return}
  if(t==='HEART'){this.heartSound();return}
  if(t==='SAW'){this.sawSound();return}
  if(t==='MAGNET'){this.magnetSound();return}
  if(t==='HARPOON'){this.harpoonSound();return}
  if(t==='PLUNGER'){this.plungerSound();return}
  if(t==='BALLOON'){this.balloonSound();return}
  if(t==='TRAMPOLINE'){this.springSound();return}
  if(t==='DISCO'){this.discoSound();return}
  if(t==='SLAP'){this.slapSound();return}
  if(t==='COWARD'){this.cowardSound();return}
  if(t==='SWAP'){this.swapSound();return}
  if(t==='MACHINE'){this.tone(260,.07,'square',.14,90);this.noise(.05,.15,2500);return}
  this.tone(t==='SWIFT'?240:t==='HEAVY'?100:160,.14);
  if(t==='FIRE')this.noise(.2,.2,3000)
 },
 hit(crit,t){
  if(t==='CHICKEN'||t==='HEN')this.cocorico();
  if(t==='HEART'){this.heartSound();return}
  if(t==='PLUNGER'){this.plungerSound();return}
  if(t==='BALLOON'){this.balloonSound();return}
  if(t==='TRAMPOLINE'){this.springSound();return}
  if(t==='DISCO'){this.discoSound();return}
  if(t==='SLAP'){this.slapSound();return}
  if(t==='ANVIL'){this.anvilSound();return}
  if(t==='SWAP'){this.swapSound();return}
  if(t==='SAW')this.sawSound();
  this.noise(.12,crit?.7:.4,crit?1600:700);
  if(crit)this.tone(880,.25,'sine',.25,200)
 },
 miss(t){
  if(t==='CHICKEN'||t==='HEN'){this.cocorico();return}
  if(t==='HEART'){this.heartSound();return}
  if(t==='PLUNGER'){this.plungerSound();return}
  if(t==='BALLOON'){this.balloonSound();return}
  if(t==='TRAMPOLINE'){this.springSound();return}
  if(t==='DISCO'){this.discoSound();return}
  if(t==='COWARD'){this.cowardSound();return}
  this.tone(100,.09,'sine',.25,30)
 },
 win(){[262,330,392,523].forEach((f,i)=>setTimeout(()=>this.tone(f,.3,'triangle',.18,f*.98),i*110))}};
$('bgmBtn').onclick=()=>{snd.bgmOn=!snd.bgmOn;$('bgmBtn').textContent=snd.bgmOn?'🎵':'🔇🎵';snd.init()};
$('snd').onclick=()=>{snd.on=!snd.on;$('snd').textContent=snd.on?'🔊':'🔇';snd.init()};

/* ---------- PAUSA E TELAS ---------- */
function closeOv(){$('ov').style.display='none'}
function startFreshGame(){
 closeOv();
 snd.init();
 score=0;
 initStage(1);
}
function openStart(){
 save();
 state='START';
 drag=false;
 snd.syncBgm();
 ov(
  'Confronto Medieval',
  'DUELO DE ARQUEIROS',
  '🎯 <b>Mirar:</b> arraste a partir do arqueiro, para trás, e solte.<br>💨 <b>Vento:</b> empurra as flechas.<br>🤣 <b>Flechas Malucas e Trolagens:</b> Desentupidor 🪠, Balão 🎈, Ímã 🧲, Mola 🤸, Galinha 🐓, Disco 🪩, Tapa 🖐️, Bigorna 🪨, Covarde 🫣, Troca 🔄, Frango 🐔, Coração 💘 e Veneno ☠️.<br>⏸️ <b>Pausar:</b> pressione <b>ESC</b> a qualquer momento.',
  [{label:'INICIAR DUELO',cls:'',cb:startFreshGame}]
 );
}
function togglePause(){
 if(state==='START'||state==='END')return;
 if(state==='PAUSED'){
  closeOv();
  state=prevState||'PLAY';
  snd.syncBgm();
  last=performance.now();
  return;
 }
 prevState=state;
 state='PAUSED';
 drag=false;
 snd.syncBgm();
 ov(
  'Jogo Pausado',
  'PAUSA',
  '<b>Fase:</b> '+st+' · '+bi.n+'<br><b>Distância:</b> '+dist+' metros<br><b>Pontuação atual:</b> '+score+'<br><small>Pressione ESC para continuar.</small>',
  [
   {label:'CONTINUAR',cls:'',cb:()=>{closeOv();state=prevState||'PLAY';snd.syncBgm();last=performance.now();}},
   {label:'REINICIAR',cls:'sec',cb:startFreshGame},
   {label:'SAIR',cls:'out',cb:openStart}
  ]
 );
}
$('pbtn').onclick=()=>{snd.init();togglePause()};

/* ---------- FASES ---------- */
function surf(x){for(const p of plats){const d=Math.abs(x-p.x),h2=p.w/2;if(d<=h2){if(p.k==='hill')return -p.h*Math.min(1,(h2-d)/(h2-45));return -p.h}}return 0}
function clampArenaX(x){
 const minX=-110;
 const maxX=Math.max(minX+120,A.x+110);
 return Math.max(minX,Math.min(maxX,x));
}
function initStage(n){
 st=n;dist=Math.min(90,18+(n-1)*8);bi=BIO[(n-1)%4];const pr=PRE[(n-1)%PRE.length];
 Object.assign(P,makeChar(),{x:0,y:-pr[0]});
 Object.assign(A,makeChar(),{x:dist*PPM,y:-pr[1]});
 plats=[];if(pr[0])plats.push({x:P.x,w:pr[2]==='hill'?190:110,h:pr[0],k:pr[2]});if(pr[1])plats.push({x:A.x,w:pr[3]==='hill'?190:110,h:pr[1],k:pr[3]});
 KEYS.forEach(k=>ammo[k]=AR[k].m);sel='STD';
 wc='BOW';wa={BOW:Infinity,AXE:4,SPEAR:5};
 aw={AXE:3,SPEAR:4,POISON:2,CHICKEN:2,HEART:2,SAW:2,MAGNET:2,HARPOON:2,MACHINE:2};
 burstQueue=[];trampolines=[];
 wind=n<2?0:+((Math.random()*2-1)*Math.min(6,1.5+n*.6)).toFixed(1);
 arrows=[];parts=[];txts=[];combo=0;over=false;slow=0;
 const r=Math.random;trees=[];for(let x=-600;x<A.x+700;x+=45+r()*80)trees.push({x,h:55+r()*75,z:r()<.45?.6:1,o:r()});
 clouds=[...Array(6)].map(()=>({x:r()*1000,y:20+r()*180,s:.6+r(),v:4+r()*8}));
 stars=[...Array(80)].map(()=>({x:r(),y:r()*.55,s:r()*1.6+.3,p:r()*6}));
 snow=[...Array(100)].map(()=>({x:r(),y:r(),s:r()*2+1}));
 fit();bar();hud();state='PLAY';prevState='PLAY';turnOf='P';setTurn();snd.syncBgm()}
function fit(){
 const span=Math.abs(A.x-P.x)+380,top=420+Math.max(-P.y,-A.y);
 cam.s=Math.max(.28,Math.min(1.1,W/span,(H-190)/top));
 cam.oy=H-105;cam.ox=W/2-(P.x+A.x)/2*cam.s}
function setTurn(){
 const e=$('tn');

function sim(x,y,al,v,t,wd){const a=eff({t,k:ai.k});const dir=A.x>=P.x?-1:1;let vx=Math.cos(al)*v,vy=Math.sin(al)*v,best=1e9;const tx=P.x,ty=P.y-42;

function upAim(e){

 const dx=P.x-w.x;

 aim.p=Math.min(1,Math.hypot(dx,dy)*cam.s/100);

  aim.a=Math.max(-1.5,Math.min(.9,aim.a));

  let norm=aim.a;
  while(norm>Math.PI)norm-=Math.PI*2;
  while(norm<-Math.PI)norm+=Math.PI*2;
  if(norm>=0)aim.a=Math.min(Math.PI,Math.max(Math.PI-.9,norm));
  else aim.a=Math.max(-Math.PI,Math.min(-Math.PI+1.5,norm));
 }
}

/* ---------- LOOP ---------- */
function upd(dt){
 if(state==='PAUSED')return;
 T+=dt;if(slow>0)slow-=dt;const ts=slow>0?.32:1;dt*=ts;shake*=.9;

 for(let i=trampolines.length-1;i>=0;i--){
  const tr=trampolines[i];tr.life-=dt;tr.squash=Math.max(0,tr.squash-dt*3);
  if(tr.life<=0)trampolines.splice(i,1);
 }

 for(const c of[P,A]){
  if(c.plunger>0&&!c.dead)c.plunger=Math.max(0,c.plunger-dt);
  if(c.hen>0&&!c.dead){
   c.hen=Math.max(0,c.hen-dt);
   if(!c.air){c.x=clampArenaX(c.x+Math.sin(T*14)*95*dt);c.y=surf(c.x);}
   if(Math.random()<.2)parts.push({x:c.x,y:c.y-25,vx:(Math.random()-.5)*40,vy:-20,c:'#fffaf0',l:.35,m:.35,s:2.5});
  }
  if(c.disco>0&&!c.dead){
   c.disco=Math.max(0,c.disco-dt);
   if(Math.random()<.35)spawnDisco(c.x,c.y,2);
  }
  if(c.balloon>0&&!c.dead){
   c.balloon=Math.max(0,c.balloon-dt);
   c.vy-=G*1.75*dt;
   c.air=true;
  }
  if(c.bounce>0&&!c.dead)c.bounce=Math.max(0,c.bounce-dt);

  if(c.air){
   c.x+=c.vx*dt;
   const clampedX=clampArenaX(c.x);
