<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Topete vs. Barba</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #06070d;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }

    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      gap: 10px;
    }

    /* HUD */
    .hud {
      width: 100%;
      background: #0d111f;
      border: 2px solid #1e3a8a;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.35);
      border-radius: 10px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1.2fr 1.1fr 0.6fr 1fr;
      align-items: center;
      gap: 8px;
    }

    .hud-box { display: flex; flex-direction: column; }
    .hud-box.center { align-items: center; }
    .hud-box.right { align-items: flex-end; }

    .hud-label {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #60a5fa;
      font-weight: 700;
    }

    .hud-value {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .hud-value.best { color: #facc15; }

    .lives-container {
      display: flex;
      gap: 5px;
      margin-top: 4px;
      height: 20px;
      align-items: center;
    }

    .power-badge {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #172038;
      color: #475569;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .power-badge.active {
      background: rgba(37, 99, 235, 0.25);
      color: #38bdf8;
      border: 1px solid #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
      animation: pulseBadge 0.6s infinite alternate;
    }

    @keyframes pulseBadge {
      from { opacity: 0.75; }
      to { opacity: 1; }
    }

    /* Canvas */
    .canvas-container {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background-color: #04050a;
      border: 3px solid #2563eb;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(37, 99, 235, 0.45), inset 0 0 15px rgba(37, 99, 235, 0.2);
      max-width: 100%;
      height: auto;
      display: block;
      touch-action: none;
    }

    .controls-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.74rem;
      color: #94a3b8;
      padding: 0 4px;
    }

    .btn-group { display: flex; gap: 6px; flex-shrink: 0; }

    .btn-sound {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sound:hover { background: #2563eb; }

    /* Recordes */
    .leaderboard {
      width: 100%;
      background: #0d111f;
      border: 2px solid #1e3a8a;
      border-radius: 10px;
      padding: 10px 14px;
    }

    .leaderboard h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #facc15;
      margin-bottom: 8px;
      text-align: center;
      text-shadow: 0 0 8px rgba(250, 204, 21, 0.3);
    }

    .score-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .score-list li {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.03);
      font-variant-numeric: tabular-nums;
    }

    .score-list li:first-child {
      color: #facc15;
      font-weight: 700;
      background: rgba(250, 204, 21, 0.08);
    }

    .rank-tag { color: #60a5fa; font-weight: 700; margin-right: 8px; }
  </style>

<body>

  <div class="game-wrapper">
    <header class="hud">
      <div class="hud-box">
        <span class="hud-label">Pontuação</span>
        <span class="hud-value" id="hud-score">0</span>
      </div>

      <div class="hud-box">
        <span class="hud-label">Recorde</span>
        <span class="hud-value best" id="hud-best">0</span>
      </div>

      <div class="hud-box center">
        <span class="hud-label">Nível</span>
        <span class="hud-value" id="hud-level">1</span>
      </div>

      <div class="hud-box right">
        <span class="hud-label">Vidas</span>
        <div class="lives-container" id="hud-lives"></div>
      </div>

      <div class="power-badge" id="power-indicator">Modo Normal</div>
    </header>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="494" height="546"></canvas>
    </div>

    <div class="controls-bar">
      <span>Setas/WASD &bull; P: pausa &bull; M: som &bull; Mobile: deslize</span>
      <div class="btn-group">
        <button class="btn-sound" id="togglePause">Pausar</button>
        <button class="btn-sound" id="toggleSound">Som: LIGADO</button>
      </div>
    </div>

    <section class="leaderboard">
      <h2>Top 5 Recordes Locais</h2>
      <ul class="score-list" id="highscores-list"></ul>
    </section>
  </div>

  <script>
    /**
     * TOPETE VS. BARBA - Vanilla JS
     *
     * Principais mudanças em relação à versão anterior:
     *  - Movimento independente da taxa de atualização do monitor (delta time).
     *  - Movimento "de centro em centro" das células: curvas precisas, sem travar em quinas.
     *  - Curva antecipada (buffer de direção) e tolerância de curva logo após o cruzamento.
     *  - Fantasmas com modos Dispersão/Perseguição, personalidades clássicas, estado
     *    "olhos" (voltam para casa), assustado aleatório e saída/entrada da casa.
     *  - Fruta bônus, vida extra, animação de morte, "PRONTO!", pausa, hit-stop ao comer fantasma.
     *  - Dificuldade progressiva por nível.
     */

    // ============================================================================
    // 1. SINTETIZADOR DE ÁUDIO (WEB AUDIO API)
    // ============================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.wakaToggle = false;
      }

      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }

      _tone(type, f0, f1, dur, vol, delay = 0, curve = 'exp') {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f0, t);
        if (f1 !== f0) {
          if (curve === 'exp') osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
          else osc.frequency.linearRampToValueAtTime(f1, t + dur);
        }
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.01);
      }

      playWaka() {
        const a = this.wakaToggle;
        this.wakaToggle = !this.wakaToggle;
        this._tone('triangle', a ? 260 : 340, a ? 440 : 190, 0.08, 0.12);
      }
      playPowerPellet() {
        this._tone('sine', 300, 750, 0.15, 0.18, 0, 'lin');
        this._tone('sine', 750, 450, 0.17, 0.15, 0.15, 'lin');
      }
      playPowerPulse() { this._tone('sine', 520, 680, 0.14, 0.06, 0, 'lin'); }
      playEatGhost() { this._tone('sawtooth', 220, 1100, 0.35, 0.18); }
      playLevelUp() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this._tone('square', f, f, 0.18, 0.12, i * 0.11));
      }
      playDeath() {
        for (let i = 0; i < 9; i++) {
          const f = 620 - i * 55;
          this._tone('sawtooth', f, f - 40, 0.1, 0.15, i * 0.1, 'lin');
        }
      }
      playFruit() {
        this._tone('triangle', 700, 1400, 0.12, 0.16);
        this._tone('triangle', 1400, 1800, 0.1, 0.14, 0.1);
      }
      playExtraLife() {
        [880, 1174.66, 1567.98].forEach((f, i) => this._tone('square', f, f, 0.15, 0.1, i * 0.12));
      }
    }

    // ============================================================================
    // 2. MAPA E CONSTANTES
    // ============================================================================

    const STORAGE_KEY = 'neon_maze_top5_scores';

    function loadHighScores() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveHighScore(newScore) {
      if (newScore <= 0) return;
      const scores = loadHighScores();
      const dateStr = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
      scores.push({ score: newScore, date: dateStr });
      scores.sort((a, b) => b.score - a.score);
      const top5 = scores.slice(0, 5);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(top5));
      } catch (e) {
        console.warn('Não foi possível salvar no localStorage.');
      }
      renderHighScores();
    }

    function renderHighScores() {
      const listEl = document.getElementById('highscores-list');
      const scores = loadHighScores();
      listEl.innerHTML = '';

      if (scores.length === 0) {
        listEl.innerHTML = '<li><span style="color:#64748b; width:100%; text-align:center;">Nenhum recorde registrado ainda</span></li>';
        return;
      }

      scores.forEach((entry, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span><span class="rank-tag">#${index + 1}</span> ${entry.score.toLocaleString('pt-BR')} pts</span>
          <span style="color:#64748b; font-size:0.78rem;">${entry.date}</span>
        `;
        listEl.appendChild(li);
      });
    }

    // ============================================================================
    // 4. PARTÍCULAS E TEXTOS FLUTUANTES
    // ============================================================================
    class ParticleSystem {
      constructor() {
        this.particles = [];
        this.floatingTexts = [];
      }

      clear() {
        this.particles.length = 0;
        this.floatingTexts.length = 0;
      }

      spawnExplosion(x, y, color, count = 18) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.2 + Math.random() * 3.5;
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            decay: 0.02 + Math.random() * 0.025,
            size: 2.5 + Math.random() * 3,
            color
          });
        }
      }

      spawnSparkles(x, y) { this.spawnExplosion(x, y, '#38bdf8', 12); }

      spawnScoreText(x, y, text, color = '#facc15') {
        this.floatingTexts.push({ x, y, text, color, life: 1.0, vy: -0.7 });
      }

      update(dt) {
        const k = dt * 60;
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * k;
          p.y += p.vy * k;
          const damp = Math.pow(0.96, k);
          p.vx *= damp;
          p.vy *= damp;
          p.life -= p.decay * k;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i];
          ft.y += ft.vy * k;
          ft.life -= 0.018 * k;
          if (ft.life <= 0) this.floatingTexts.splice(i, 1);
        }
      }

      draw(ctx) {
        this.particles.forEach(p => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        this.floatingTexts.forEach(ft => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, ft.life);
          ctx.font = 'bold 14px "Segoe UI", sans-serif';
          ctx.fillStyle = ft.color;
          ctx.textAlign = 'center';
          ctx.shadowBlur = 6;
          ctx.shadowColor = '#000';
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        });
      }
    }

    // ============================================================================
    // 5. JOGO
    // ============================================================================
    class PacManGame {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.canvas.width = WIDTH * 2;
        this.canvas.height = HEIGHT * 2;
        this.canvas.style.width = (WIDTH + 6) + 'px';
        this.ctx = this.canvas.getContext('2d');
        this.ctx.scale(2, 2);
        this.sound = new SoundEngine();
        this.fx = new ParticleSystem();

        this.elScore = document.getElementById('hud-score');
        this.elBest = document.getElementById('hud-best');
        this.elLevel = document.getElementById('hud-level');
        this.elLives = document.getElementById('hud-lives');
        this.elPower = document.getElementById('power-indicator');
        this.elPauseBtn = document.getElementById('togglePause');
        this.hudCache = {};

        // 'START' | 'READY' | 'PLAYING' | 'PAUSED' | 'DYING' | 'LEVEL_CLEAR' | 'GAME_OVER'
        this.state = 'START';
        this.prevState = 'PLAYING';
        this.stateTimer = 0;
        this.time = 0;
        this.lastTime = 0;
        this.freezeTimer = 0;
        this.deathT = 0;
        this.deathBurst = false;

        this.bestStored = this.readBest();
        this.newGame();
        this.bindInputs();
        renderHighScores();
        this.updateHUD();
      }

      readBest() {
        const s = loadHighScores();
        return s.length ? s[0].score : 0;
      }

      // --------------------------------------------------------------------------
      // PARTIDA / NÍVEL
      // --------------------------------------------------------------------------
      newGame() {
        this.score = 0;
        this.level = 1;
        this.lives = 3;
        this.nextExtraLife = 10000;
        this.scoreSaved = false;
        this.loadLevel();
      }

      loadLevel() {
        this.map = BASE_MAP.map(row => [...row]);
        this.pelletsRemaining = 0;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.map[r][c] === 0 || this.map[r][c] === 3) this.pelletsRemaining++;
          }
        }
        this.pelletsTotal = this.pelletsRemaining;

        const L = this.level;
        this.params = {
          playerSpeed: 2.3,
          ghostSpeed: Math.min(2.35, 1.85 + (L - 1) * 0.07),
          frightTime: Math.max(3, 8 - (L - 1) * 0.9)
        };
        const sc = Math.max(0.45, 1 - (L - 1) * 0.1);
        this.modeSchedule = [
          ['scatter', 7 * sc], ['chase', 20], ['scatter', 7 * sc], ['chase', 20],
          ['scatter', 5 * sc], ['chase', 20], ['scatter', 5 * sc], ['chase', Infinity]
        ];

        this.fruit = null;
        this.fruitSpawned = 0;
        this.fruitThresholds = [Math.floor(this.pelletsTotal * 0.33), Math.floor(this.pelletsTotal * 0.7)];

        this.buildEatenMap();
        this.mazeNormal = this.buildMaze('#3b82f6', '#2563eb');
        this.mazeFlash = this.buildMaze('#ffffff', '#bae6fd');
        this.fx.clear();
        this.resetActors();
      }

      resetActors() {
        this.powerTimer = 0;
        this.ghostCombo = 0;
        this.sirenPulseTimer = 0;
        this.freezeTimer = 0;
        this.modeIndex = 0;
        this.mode = this.modeSchedule[0][0];
        this.modeTimer = this.modeSchedule[0][1];

        this.player = {
          x: tileCenter(9),
          y: tileCenter(16),
          dir: DIRS.NONE,
          nextDir: DIRS.NONE,
          bufferTimer: 0,
          lastAngle: Math.PI,
          facing: -1,          // -1 = olhando para a esquerda | 1 = direita
          mouthPhase: 0
        };

        const starts = [[9, 8], [9, 10], [8, 10], [10, 10]];
        this.ghosts = GHOST_DEFS.map((def, i) => ({
          def,
          x: tileCenter(starts[i][0]),
          y: tileCenter(starts[i][1]),
          dir: i === 0 ? DIRS.LEFT : DIRS.UP,
          state: i === 0 ? 'active' : 'house',   // house | leaving | active | eaten | entering
          frightened: false,
          releaseTimer: def.release * Math.max(0.5, 1 - (this.level - 1) * 0.08)
        }));
      }

      // Distâncias (BFS) até a saída da casa: guia os "olhos" de volta
      buildEatenMap() {
        const dist = Array.from({ length: ROWS }, () => Array(COLS).fill(Infinity));
        const queue = [[9, 8]];
        dist[8][9] = 0;
        while (queue.length) {
          const [c, r] = queue.shift();
          for (const d of DIR_ORDER) {
            const nc = c + d.x, nr = r + d.y;
            if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) continue;
            if (dist[nr][nc] !== Infinity) continue;
            if (!this.isWalkable(nc, nr, true, true)) continue;
            dist[nr][nc] = dist[r][c] + 1;
            queue.push([nc, nr]);
          }
        }
        this.eatenDist = dist;
      }

      // Labirinto pré-renderizado (muito mais leve que desenhar com sombra a cada frame)
      buildMaze(edgeColor, glowColor) {
        const cv = document.createElement('canvas');
        cv.width = WIDTH;
        cv.height = HEIGHT;
        const g = cv.getContext('2d');
        const walls = [];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (BASE_MAP[r][c] === 1) walls.push([c * TILE_SIZE, r * TILE_SIZE]);
          }
        }
        // 1ª passada: contorno neon expandido (apenas as bordas externas sobrevivem)
        g.fillStyle = edgeColor;
        g.shadowColor = glowColor;
        g.shadowBlur = 12;
        walls.forEach(([x, y]) => g.fillRect(x - 1.5, y - 1.5, TILE_SIZE + 3, TILE_SIZE + 3));
        // 2ª passada: preenchimento escuro por cima
        g.shadowBlur = 0;
        g.fillStyle = '#050a1c';
        walls.forEach(([x, y]) => g.fillRect(x, y, TILE_SIZE, TILE_SIZE));
        return cv;
      }

      // --------------------------------------------------------------------------
      // ENTRADA (TECLADO, TOQUE, BOTÕES)
      // --------------------------------------------------------------------------
      startGame() {
        this.sound.init();
        this.newGame();
        this.state = 'READY';
        this.stateTimer = 2.2;
        this.bestStored = this.readBest();
      }

      togglePause() {
        if (this.state === 'PLAYING' || this.state === 'READY') {
          this.prevState = this.state;
          this.state = 'PAUSED';
        } else if (this.state === 'PAUSED') {
          this.state = this.prevState;
          this.lastTime = 0;
        }
        this.elPauseBtn.textContent = this.state === 'PAUSED' ? 'Continuar' : 'Pausar';
      }

      setNextDir(dir) {
        if (!this.player) return;
        this.player.nextDir = dir;
        this.player.bufferTimer = 0.6; // a curva antecipada expira se não for possível logo
      }

      bindInputs() {
        const KEYMAP = {
          arrowup: DIRS.UP, w: DIRS.UP,
          arrowdown: DIRS.DOWN, s: DIRS.DOWN,
          arrowleft: DIRS.LEFT, a: DIRS.LEFT,
          arrowright: DIRS.RIGHT, d: DIRS.RIGHT
        };

        window.addEventListener('keydown', (e) => {
          const key = e.key.toLowerCase();
          if (key in KEYMAP || key === ' ') e.preventDefault();

          if (key === 'p' || key === 'escape') { this.togglePause(); return; }
          if (key === 'm') { document.getElementById('toggleSound').click(); return; }

          const dir = KEYMAP[key];
          const confirm = key === 'enter' || key === ' ';

          if (this.state === 'START') {
            if (dir || confirm) this.startGame();
          } else if (this.state === 'GAME_OVER') {
            if (confirm && this.stateTimer <= 0) this.startGame();
            return;
          } else if (this.state === 'PAUSED') {
            if (confirm) this.togglePause();
            return;
          }
          if (dir) this.setNextDir(dir);
        });

        // Toque / swipe: a direção é lida durante o deslize (sem esperar soltar o dedo)
        let tx = 0, ty = 0;
        this.canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          this.sound.init();
          if (e.touches.length > 0) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }
          this.tapAction();
        }, { passive: false });

        this.canvas.addEventListener('touchmove', (e) => {
          e.preventDefault();
          if (e.touches.length === 0) return;
          const cx = e.touches[0].clientX, cy = e.touches[0].clientY;
          const dx = cx - tx, dy = cy - ty;
          if (Math.max(Math.abs(dx), Math.abs(dy)) > 18) {
            if (Math.abs(dx) > Math.abs(dy)) this.setNextDir(dx > 0 ? DIRS.RIGHT : DIRS.LEFT);
            else this.setNextDir(dy > 0 ? DIRS.DOWN : DIRS.UP);
            tx = cx; ty = cy; // recomeça a medir: permite encadear curvas num só deslize
          }
        }, { passive: false });

        this.canvas.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });

        this.canvas.addEventListener('click', () => { this.sound.init(); this.tapAction(); });

        const btnSound = document.getElementById('toggleSound');
        btnSound.addEventListener('click', () => {
          const on = this.sound.toggle();
          btnSound.textContent = on ? 'Som: LIGADO' : 'Som: MUDO';
        });
        this.elPauseBtn.addEventListener('click', () => this.togglePause());

        // Pausa automática ao perder o foco
        document.addEventListener('visibilitychange', () => {
          if (document.hidden && (this.state === 'PLAYING' || this.state === 'READY')) this.togglePause();
        });
        window.addEventListener('blur', () => {
          if (this.state === 'PLAYING' || this.state === 'READY') this.togglePause();
        });
        // Não perde a pontuação se a aba for fechada no meio da partida
        window.addEventListener('pagehide', () => this.finishRun());
      }

      tapAction() {
        if (this.state === 'START') this.startGame();
        else if (this.state === 'GAME_OVER' && this.stateTimer <= 0) this.startGame();
        else if (this.state === 'PAUSED') this.togglePause();
      }

      finishRun() {
        if (this.scoreSaved || this.score <= 0) return;
        this.scoreSaved = true;
        saveHighScore(this.score);
        this.bestStored = this.readBest();
      }

      // --------------------------------------------------------------------------
      // GRADE, COLISÃO COM PAREDES E MOVIMENTO CENTRO-A-CENTRO
      // --------------------------------------------------------------------------
      isWalkable(col, row, isGhost = false, canUseDoor = false) {
        if (row === TUNNEL_ROW && (col < 0 || col >= COLS)) return true;
        if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return false;
        const tile = this.map[row][col];
        if (tile === 1) return false;
        if (tile === 5) return isGhost && canUseDoor;
        if (tile === 4) return isGhost;
        return true;
      }

      canWalk(col, row, dir, isGhost = false, canUseDoor = false) {
        return this.isWalkable(col + dir.x, row + dir.y, isGhost, canUseDoor);
      }

      atCenter(e) {
        const cx = Math.floor(e.x / TILE_SIZE) * TILE_SIZE + TILE_SIZE / 2;
        const cy = Math.floor(e.y / TILE_SIZE) * TILE_SIZE + TILE_SIZE / 2;
        return Math.abs(e.x - cx) < 1e-6 && Math.abs(e.y - cy) < 1e-6;
      }

      // Distância até o próximo centro de célula na direção atual (TILE_SIZE se já está no centro)
      distToNextCenter(e) {
        const pos = e.dir.x !== 0 ? e.x : e.y;
        const sign = e.dir.x !== 0 ? e.dir.x : e.dir.y;
        const c = Math.floor(pos / TILE_SIZE) * TILE_SIZE + TILE_SIZE / 2;
        let d = sign > 0 ? c - pos : pos - c;
        if (d <= 1e-6) d += TILE_SIZE;
        return d;
      }

      wrapTunnel(e) {
        const period = (COLS + 1) * TILE_SIZE;
        if (e.x < -TILE_SIZE / 2 - 1e-6) e.x += period;
        else if (e.x > COLS * TILE_SIZE + TILE_SIZE / 2 + 1e-6) e.x -= period;
      }

      // Move a entidade "dist" pixels. Em cada centro de célula, chama choose() para decidir a direção.
      moveEntity(e, dist, choose) {
        let guard = 0;
        while (dist > 1e-4 && guard++ < 16) {
          if (this.atCenter(e)) {
            const col = Math.floor(e.x / TILE_SIZE);
            const row = Math.floor(e.y / TILE_SIZE);
            e.x = tileCenter(col);
            e.y = tileCenter(row);
            e.dir = choose(e, col, row);
            if (e.dir === DIRS.NONE) return;
          } else if (e.dir === DIRS.NONE) {
            return;
          }
          const d = this.distToNextCenter(e);
          const step = Math.min(dist, d);
          e.x += e.dir.x * step;
          e.y += e.dir.y * step;
          dist -= step;
          if (step >= d - 1e-9) {
            if (e.dir.x !== 0) e.x = tileCenter(Math.floor(e.x / TILE_SIZE));
            else e.y = tileCenter(Math.floor(e.y / TILE_SIZE));
          }
          this.wrapTunnel(e);
        }
      }

      tileOf(e) {
        return {
          col: Math.max(0, Math.min(COLS - 1, Math.floor(e.x / TILE_SIZE))),
          row: Math.max(0, Math.min(ROWS - 1, Math.floor(e.y / TILE_SIZE)))
        };
      }

      // --------------------------------------------------------------------------
      // JOGADOR
      // --------------------------------------------------------------------------
      updatePlayer(dt) {
        const p = this.player;
        const k = dt * 60;

        if (p.nextDir !== DIRS.NONE) {
          p.bufferTimer -= dt;
          if (p.bufferTimer <= 0 || p.nextDir === p.dir) p.nextDir = DIRS.NONE;
        }

        if (p.nextDir !== DIRS.NONE && p.dir !== DIRS.NONE) {
          if (p.nextDir === p.dir.opp) {
            // Inversão de 180° é sempre imediata
            p.dir = p.nextDir;
            p.nextDir = DIRS.NONE;
          } else {
            // Tolerância de curva: passou do centro há poucos pixels? Volta e vira.
            const col = Math.floor(p.x / TILE_SIZE);
            const row = Math.floor(p.y / TILE_SIZE);
            const cx = tileCenter(col), cy = tileCenter(row);
            const off = (p.x - cx) * p.dir.x + (p.y - cy) * p.dir.y;
            if (off > 0 && off <= 7 && this.canWalk(col, row, p.nextDir)) {
              p.x = cx;
              p.y = cy;
              p.dir = p.nextDir;
              p.nextDir = DIRS.NONE;
            }
          }
        }

        const choose = (e, col, row) => {
          if (e.nextDir !== DIRS.NONE && this.canWalk(col, row, e.nextDir)) {
            const d = e.nextDir;
            e.nextDir = DIRS.NONE;
            return d;
          }
          if (e.dir !== DIRS.NONE && this.canWalk(col, row, e.dir)) return e.dir;
          return DIRS.NONE;
        };

        const moved = { x: p.x, y: p.y };
        this.moveEntity(p, this.params.playerSpeed * k, choose);

        if (p.dir !== DIRS.NONE) {
          p.lastAngle = p.dir.angle;
          if (p.dir.x !== 0) p.facing = p.dir.x;
          if (Math.abs(p.x - moved.x) + Math.abs(p.y - moved.y) > 0) p.mouthPhase += dt * 22;
        }

        this.collectAt(p);
      }

      addScore(points) {
        this.score += points;
        while (this.score >= this.nextExtraLife) {
          this.nextExtraLife += 10000;
          if (this.lives < 6) this.lives++;
          this.sound.playExtraLife();
          this.fx.spawnScoreText(this.player.x, this.player.y - 16, 'VIDA EXTRA!', '#4ade80');
        }
      }

      collectAt(p) {
        const col = Math.floor(p.x / TILE_SIZE);
        const row = Math.floor(p.y / TILE_SIZE);
        if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
        if (Math.hypot(p.x - tileCenter(col), p.y - tileCenter(row)) > 9) return;

        const t = this.map[row][col];
        if (t === 0) {
          this.map[row][col] = 2;
          this.pelletsRemaining--;
          this.addScore(10);
          this.sound.playWaka();
        } else if (t === 3) {
          this.map[row][col] = 2;
          this.pelletsRemaining--;
          this.addScore(50);
          this.activatePowerMode(p.x, p.y);
        } else {
          return;
        }

        if (this.pelletsRemaining <= 0) {
          this.sound.playLevelUp();
          this.state = 'LEVEL_CLEAR';
          this.stateTimer = 2.4;
        }
      }

      activatePowerMode(x, y) {
        this.powerTimer = this.params.frightTime;
        this.ghostCombo = 0;
        this.sirenPulseTimer = 0;
        this.sound.playPowerPellet();
        this.fx.spawnSparkles(x, y);

        this.ghosts.forEach(g => {
          if (g.state === 'eaten' || g.state === 'entering') return;
          g.frightened = true;
          if (g.state === 'active') g.dir = g.dir.opp; // inverte a direção, como no clássico
        });
      }

      endPower() {
        this.powerTimer = 0;
        this.ghostCombo = 0;
        this.ghosts.forEach(g => { g.frightened = false; });
      }

      // --------------------------------------------------------------------------
      // FANTASMAS
      // --------------------------------------------------------------------------
      updateModeTimer(dt) {
        if (this.powerTimer > 0) return; // o relógio de modos pausa durante a pílula
        if (!isFinite(this.modeTimer)) return;
        this.modeTimer -= dt;
        if (this.modeTimer <= 0 && this.modeIndex < this.modeSchedule.length - 1) {
          this.modeIndex++;
          this.mode = this.modeSchedule[this.modeIndex][0];
          this.modeTimer = this.modeSchedule[this.modeIndex][1];
          this.ghosts.forEach(g => { if (g.state === 'active') g.dir = g.dir.opp; });
        }
      }

      ghostSpeed(g) {
        if (g.state === 'eaten') return 4.4;
        const base = this.params.ghostSpeed;
        let sp = base * g.def.speedMul;
        if (g.frightened) {
          sp = base * 0.55;
        } else if (g.def.name === 'Blinky') {
          // "Cruise Elroy": acelera quando restam poucas pastilhas
          if (this.pelletsRemaining <= 10) sp *= 1.15;
          else if (this.pelletsRemaining <= 25) sp *= 1.07;
        }
        const col = Math.floor(g.x / TILE_SIZE);
        const row = Math.floor(g.y / TILE_SIZE);
        if (row === TUNNEL_ROW && (col <= 1 || col >= COLS - 2)) sp *= 0.6; // túnel deixa mais lento
        return sp;
      }

      updateGhosts(dt) {
        const k = dt * 60;
        const p = this.player;

        for (const g of this.ghosts) {
          switch (g.state) {
            case 'house':
              g.releaseTimer -= dt;
              if (g.releaseTimer <= 0) g.state = 'leaving';
              break;
            case 'leaving':
              this.moveLeaving(g, k);
              break;
            case 'entering':
              this.moveEntering(g, k);
              break;
            default:
              this.moveEntity(g, this.ghostSpeed(g) * k, (e, c, r) => this.chooseGhostDir(e, c, r));
          }

          if (g.state === 'active' && Math.hypot(g.x - p.x, g.y - p.y) < TILE_SIZE * 0.6) {
            if (g.frightened) {
              this.eatGhost(g);
            } else {
              this.killPlayer();
              return;
            }
          }
        }
      }

      moveLeaving(g, k) {
        const tx = tileCenter(9), ty = tileCenter(8);
        const sp = 1.5 * k;
        if (Math.abs(g.x - tx) > 0.01) {
          const dx = tx - g.x;
          g.x += Math.sign(dx) * Math.min(sp, Math.abs(dx));
          g.dir = dx > 0 ? DIRS.RIGHT : DIRS.LEFT;
        } else {
          g.x = tx;
          g.y = Math.max(ty, g.y - sp);
          g.dir = DIRS.UP;
          if (g.y <= ty) {
            g.y = ty;
            g.state = 'active';
            g.dir = Math.random() < 0.5 ? DIRS.LEFT : DIRS.RIGHT;
          }
        }
      }

      moveEntering(g, k) {
        const ty = tileCenter(10);
        g.x = tileCenter(9);
        g.dir = DIRS.DOWN;
        g.y += 3 * k;
        if (g.y >= ty) {
          g.y = ty;
          g.state = 'leaving';
          g.frightened = false;
        }
      }

      playerTile() {
        return this.tileOf(this.player);
      }

      chooseGhostDir(g, col, row) {
        const eaten = g.state === 'eaten';

        if (eaten && col === 9 && row === 8) {
          g.state = 'entering';
          g.frightened = false;
          return DIRS.NONE;
        }

        let opts = DIR_ORDER.filter(d => this.canWalk(col, row, d, true, eaten));
        if (!eaten) {
          const noReverse = opts.filter(d => d !== g.dir.opp);
          if (noReverse.length) opts = noReverse;
        }
        if (opts.length === 0) return DIRS.NONE;
        if (opts.length === 1) return opts[0];

        // Olhos: seguem o caminho mais curto até a casa
        if (eaten) {
          let best = opts[0], bestD = Infinity;
          for (const d of opts) {
            const nc = col + d.x, nr = row + d.y;
            const dist = (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) ? this.eatenDist[nr][nc] : Infinity;
            if (dist < bestD) { bestD = dist; best = d; }
          }
          return best;
        }

        // Assustado: decide aleatoriamente em cada cruzamento
        if (g.frightened) return opts[Math.floor(Math.random() * opts.length)];

        // Alvo conforme o modo e a personalidade
        const pt = this.playerTile();
        const pd = this.player.dir;
        let target;
        if (this.mode === 'scatter') {
          target = g.def.scatter;
        } else {
          switch (g.def.name) {
            case 'Blinky':
              target = { col: pt.col, row: pt.row };
              break;
            case 'Pinky':
              target = { col: pt.col + pd.x * 4, row: pt.row + pd.y * 4 };
              break;
            case 'Inky': {
              const b = this.tileOf(this.ghosts[0]);
              const v = { col: pt.col + pd.x * 2, row: pt.row + pd.y * 2 };
              target = { col: 2 * v.col - b.col, row: 2 * v.row - b.row };
              break;
            }
            default: // Clyde: persegue de longe, foge do canto quando chega perto
              target = Math.hypot(col - pt.col, row - pt.row) > 8 ? { col: pt.col, row: pt.row } : g.def.scatter;
          }
        }

        let best = opts[0], bestD = Infinity;
        for (const d of opts) {
          const dx = (col + d.x) - target.col;
          const dy = (row + d.y) - target.row;
          const dist = dx * dx + dy * dy;
          if (dist < bestD) { bestD = dist; best = d; }
        }
        return best;
      }

      eatGhost(g) {
        this.ghostCombo++;
        const points = 200 * Math.pow(2, Math.min(this.ghostCombo, 4) - 1);
        this.addScore(points);
        this.sound.playEatGhost();
        this.fx.spawnExplosion(g.x, g.y, g.def.color, 24);
        this.fx.spawnScoreText(g.x, g.y - 10, `+${points}`, '#38bdf8');
        g.state = 'eaten';
        g.frightened = false;
        this.freezeTimer = 0.35; // "hit stop": dá peso à mordida
      }

      killPlayer() {
        this.lives--;
        this.sound.playDeath();
        this.state = 'DYING';
        this.deathT = 0;
        this.deathBurst = false;
        this.powerTimer = 0;
      }

      // --------------------------------------------------------------------------
      // FRUTA BÔNUS
      // --------------------------------------------------------------------------
      updateFruit(dt) {
        const f = this.fruit;
        if (f) {
          f.timer -= dt;
          if (f.timer <= 0) {
            this.fruit = null;
          } else if (Math.hypot(this.player.x - f.x, this.player.y - f.y) < TILE_SIZE * 0.65) {
            this.addScore(f.type.pts);
            this.sound.playFruit();
            this.fx.spawnScoreText(f.x, f.y - 10, `+${f.type.pts}`, '#4ade80');
            this.fx.spawnExplosion(f.x, f.y, f.type.color, 14);
            this.fruit = null;
          }
        }
        const eaten = this.pelletsTotal - this.pelletsRemaining;
        if (!this.fruit && this.fruitSpawned < 2 && eaten >= this.fruitThresholds[this.fruitSpawned]) {
          this.fruitSpawned++;
          this.fruit = {
            x: tileCenter(9),
            y: tileCenter(12),
            timer: 10,
            type: FRUITS[Math.min(this.level - 1, FRUITS.length - 1)]
          };
        }
      }

      // --------------------------------------------------------------------------
      // HUD (só mexe no DOM quando algo muda)
      // --------------------------------------------------------------------------
      updateHUD() {
        const c = this.hudCache;
        const scoreTxt = this.score.toLocaleString('pt-BR');
        if (c.score !== scoreTxt) { this.elScore.textContent = scoreTxt; c.score = scoreTxt; }

        const bestTxt = Math.max(this.bestStored, this.score).toLocaleString('pt-BR');
        if (c.best !== bestTxt) { this.elBest.textContent = bestTxt; c.best = bestTxt; }

        if (c.level !== this.level) { this.elLevel.textContent = this.level; c.level = this.level; }

        if (c.lives !== this.lives) {
          this.elLives.innerHTML = '';
          for (let i = 0; i < this.lives; i++) {
            const icon = document.createElement('div');
            icon.className = 'life-icon';
            this.elLives.appendChild(icon);
          }
          c.lives = this.lives;
        }

        const powerTxt = this.powerTimer > 0
          ? `PÍLULA DE PODER ATIVA: ${this.powerTimer.toFixed(1)}s`
          : 'Modo Normal';
        if (c.power !== powerTxt) {
          this.elPower.textContent = powerTxt;
          this.elPower.classList.toggle('active', this.powerTimer > 0);
          c.power = powerTxt;
        }
      }

      // --------------------------------------------------------------------------
      // ATUALIZAÇÃO (dt em segundos)
      // --------------------------------------------------------------------------
      update(dt) {
        this.time += dt;
        this.fx.update(dt);

        switch (this.state) {
          case 'READY':
            this.stateTimer -= dt;
            if (this.stateTimer <= 0) this.state = 'PLAYING';
            break;

          case 'PLAYING':
            if (this.freezeTimer > 0) { this.freezeTimer -= dt; break; }
            this.updateModeTimer(dt);
            if (this.powerTimer > 0) {
              this.powerTimer -= dt;
              this.sirenPulseTimer += dt;
              if (this.sirenPulseTimer >= 0.45) {
                this.sirenPulseTimer = 0;
                this.sound.playPowerPulse();
              }
              if (this.powerTimer <= 0) this.endPower();
            }
            this.updatePlayer(dt);
            if (this.state !== 'PLAYING') break;
            this.updateGhosts(dt);
            if (this.state !== 'PLAYING') break;
            this.updateFruit(dt);
            break;

          case 'DYING':
            this.deathT += dt;
            if (!this.deathBurst && this.deathT >= DEATH_FREEZE + DEATH_ANIM) {
              this.deathBurst = true;
              this.fx.spawnExplosion(this.player.x, this.player.y, '#facc15', 26);
            }
            if (this.deathT >= DEATH_FREEZE + DEATH_ANIM + 0.7) {
              if (this.lives <= 0) {
                this.state = 'GAME_OVER';
                this.stateTimer = 0.8; // trava curta: evita reiniciar sem querer
                this.finishRun();
              } else {
                this.resetActors();
                this.state = 'READY';
                this.stateTimer = 1.6;
              }
            }
            break;

          case 'LEVEL_CLEAR':
            this.stateTimer -= dt;
            if (this.stateTimer <= 0) {
              this.level++;
              this.loadLevel();
              this.state = 'READY';
              this.stateTimer = 2.0;
            }
            break;

          case 'GAME_OVER':
            if (this.stateTimer > 0) this.stateTimer -= dt;
            break;
        }

        this.updateHUD();
      }

      // --------------------------------------------------------------------------
      // RENDERIZAÇÃO
      // --------------------------------------------------------------------------
      draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        this.drawMap(ctx);
        this.drawFruit(ctx);

        const hideGhosts = this.state === 'LEVEL_CLEAR' || (this.state === 'DYING' && this.deathT >= DEATH_FREEZE);
        if (!hideGhosts) this.drawGhosts(ctx);
        if (this.state !== 'GAME_OVER') this.drawPlayer(ctx);

        this.fx.draw(ctx);
        this.drawOverlays(ctx);
      }

      drawMap(ctx) {
        let maze = this.mazeNormal;
        if (this.state === 'LEVEL_CLEAR' && Math.floor(this.time / 0.28) % 2 === 0) maze = this.mazeFlash;
        ctx.drawImage(maze, 0, 0);

        // Porta da casa
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(9 * TILE_SIZE, 9 * TILE_SIZE + TILE_SIZE / 2);
        ctx.lineTo(10 * TILE_SIZE, 9 * TILE_SIZE + TILE_SIZE / 2);
        ctx.stroke();

        // Pastilhas comuns (um único path)
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.map[r][c] === 0) {
              const cx = tileCenter(c), cy = tileCenter(r);
              ctx.moveTo(cx + 2.8, cy);
              ctx.arc(cx, cy, 2.8, 0, Math.PI * 2);
            }
          }
        }
        ctx.fill();

        // Pílulas de poder (pulsantes)
        const pulse = 5.5 + Math.sin(this.time * 9) * 1.8;
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#38bdf8';
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (this.map[r][c] === 3) {
              ctx.beginPath();
              ctx.arc(tileCenter(c), tileCenter(r), pulse, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
        ctx.shadowBlur = 0;
      }

      drawFruit(ctx) {
        const f = this.fruit;
        if (!f) return;
        // Pisca nos últimos 3 segundos
        if (f.timer < 3 && Math.floor(this.time / 0.15) % 2 === 0) return;
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.shadowBlur = 10;
        ctx.shadowColor = f.type.color;
        ctx.fillStyle = f.type.color;
        if (f.type.name === 'Cereja') {
          ctx.beginPath(); ctx.arc(-4.5, 4, 5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(5, 5, 5, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = '#4ade80';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(-4.5, -1); ctx.quadraticCurveTo(-1, -9, 3, -10);
          ctx.moveTo(5, 0); ctx.quadraticCurveTo(5, -7, 3, -10);
          ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(0, 2, 8, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = '#4ade80';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(2, -10); ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,0.45)';
          ctx.beginPath(); ctx.arc(-3, -1, 2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }

      drawPlayer(ctx) {
        const p = this.player;
        let scale = 1, spin = 0, chomp = 0;

        if (this.state === 'DYING') {
          if (this.deathT >= DEATH_FREEZE) {
            const prog = Math.min(1, (this.deathT - DEATH_FREEZE) / DEATH_ANIM);
            if (prog >= 1) return;
            scale = 1 - prog;              // a cabeça gira e encolhe
            spin = prog * Math.PI * 4;
          }
        } else if (this.state === 'PLAYING' && p.dir !== DIRS.NONE) {
          chomp = Math.abs(Math.sin(p.mouthPhase)) * 0.1;   // "mastigada"
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(spin);
        // a imagem original olha para a esquerda: espelha ao andar para a direita
        ctx.scale((p.facing > 0 ? -1 : 1) * scale * (1 + chomp), scale * (1 - chomp));
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(250, 204, 21, 0.8)';
        drawHead(ctx, HEAD_PLAYER, HEAD_SIZE);
        ctx.restore();
      }

      drawGhosts(ctx) {
        const blinking = this.powerTimer > 0 && this.powerTimer <= 2.0 && Math.floor(this.time / 0.133) % 2 === 0;

        this.ghosts.forEach(g => {
          const eaten = g.state === 'eaten' || g.state === 'entering';
          const bob = g.state === 'house' ? Math.sin(this.time * 12) * 2 : 0;

          ctx.save();
          ctx.translate(g.x, g.y + bob);

          if (eaten) {
            // comido: só os olhos voltam para casa
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-4, -3, 3.4, 0, Math.PI * 2);
            ctx.arc(4, -3, 3.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(-4 + g.dir.x * 2.2, -3 + g.dir.y * 2.2, 1.8, 0, Math.PI * 2);
            ctx.arc(4 + g.dir.x * 2.2, -3 + g.dir.y * 2.2, 1.8, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // anel colorido: diferencia os 4 inimigos e mostra quando estão vulneráveis
            const ring = g.frightened ? (blinking ? '#f8fafc' : '#2563eb') : g.def.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = ring;
            ctx.strokeStyle = ring;
            ctx.lineWidth = 2.5;
            ctx.fillStyle = g.frightened ? ring : 'rgba(4, 5, 10, 0.6)';
            ctx.beginPath();
            ctx.arc(0, 0, HEAD_SIZE / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;
            if (g.frightened) ctx.globalAlpha = 0.45;   // rosto "azulado" quando assustado
            drawHead(ctx, HEAD_GHOST, HEAD_SIZE - 1);
          }

          ctx.restore();
        });
      }

      drawOverlays(ctx) {
        const cx = WIDTH / 2;
        ctx.save();
        ctx.textAlign = 'center';

        const dim = () => {
          ctx.fillStyle = 'rgba(4, 5, 10, 0.82)';
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
        };

        if (this.state === 'START') {
          dim();
          ctx.fillStyle = '#38bdf8';
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#2563eb';
          ctx.font = 'bold 34px "Segoe UI", sans-serif';
          ctx.fillText('TOPETE VS. BARBA', cx, HEIGHT / 2 - 40);
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#facc15';
          ctx.font = 'bold 16px "Segoe UI", sans-serif';
          ctx.fillText('Pressione SETAS / WASD ou TOQUE para iniciar', cx, HEIGHT / 2 + 10);
          ctx.fillStyle = '#94a3b8';
          ctx.font = '13px "Segoe UI", sans-serif';
          ctx.fillText('Colete todas as pastilhas e fuja das barbas!', cx, HEIGHT / 2 + 40);
        } else if (this.state === 'READY') {
          ctx.fillStyle = '#facc15';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#facc15';
          ctx.font = 'bold 20px "Segoe UI", sans-serif';
          ctx.fillText('PRONTO!', cx, 12 * TILE_SIZE + TILE_SIZE / 2 + 7);
        } else if (this.state === 'PAUSED') {
          dim();
          ctx.fillStyle = '#38bdf8';
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#2563eb';
          ctx.font = 'bold 34px "Segoe UI", sans-serif';
          ctx.fillText('PAUSADO', cx, HEIGHT / 2 - 5);
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '15px "Segoe UI", sans-serif';
          ctx.fillText('Pressione P, ENTER ou toque para continuar', cx, HEIGHT / 2 + 28);
        } else if (this.state === 'LEVEL_CLEAR') {
          ctx.fillStyle = 'rgba(4, 5, 10, 0.7)';
          ctx.fillRect(0, HEIGHT / 2 - 34, WIDTH, 68);
          ctx.fillStyle = '#4ade80';
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#22c55e';
          ctx.font = 'bold 28px "Segoe UI", sans-serif';
          ctx.fillText(`NÍVEL ${this.level} CONCLUÍDO!`, cx, HEIGHT / 2 + 2);
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '14px "Segoe UI", sans-serif';
          ctx.fillText('Preparando próximo labirinto...', cx, HEIGHT / 2 + 24);
        } else if (this.state === 'GAME_OVER') {
          dim();
          ctx.fillStyle = '#ef4444';
          ctx.shadowBlur = 18;
          ctx.shadowColor = '#dc2626';
          ctx.font = 'bold 38px "Segoe UI", sans-serif';
          ctx.fillText('GAME OVER', cx, HEIGHT / 2 - 45);
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 20px "Segoe UI", sans-serif';
          ctx.fillText(`Pontuação Final: ${this.score.toLocaleString('pt-BR')}`, cx, HEIGHT / 2);
          ctx.fillStyle = '#facc15';
          ctx.font = 'bold 15px "Segoe UI", sans-serif';
          ctx.fillText('Toque na tela ou pressione ENTER para jogar novamente', cx, HEIGHT / 2 + 45);
        }

        ctx.restore();
      }

      // --------------------------------------------------------------------------
      // LOOP (delta time: mesma velocidade em 60, 120 ou 144 Hz)
      // --------------------------------------------------------------------------
      start() {
        const loop = (timestamp) => {
          if (!this.lastTime) this.lastTime = timestamp;
          const dt = Math.min(MAX_DT, Math.max(0, (timestamp - this.lastTime) / 1000));
          this.lastTime = timestamp;

          if (this.state !== 'PAUSED' && this.state !== 'START') this.update(dt);
          else if (this.state === 'START') { this.time += dt; }
          this.draw();
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const game = new PacManGame();
      game.start();
    });
  </script>
</body>
</html>
